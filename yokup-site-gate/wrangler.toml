name = "yokup-site-gate"
main = "src/index.js"
compatibility_date = "2026-08-10"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "www.yokup.com/*"
zone_name = "yokup.com"

[[routes]]
pattern = "yokup.com/*"
zone_name = "yokup.com"

# Espejo admira.biz: /mcp lo sirve este guardián, igual que yokup.com. Sin la
# ruta, Pages responde 405 al POST y el catch-all sirve la portada en
# /mcp/galaxia.json. El resto del host (login, portales, /help) sigue en Pages.
# RETORNO: quitar estas cuatro rutas y volver a publicar el guardián desde
# el tag retorno/admira-biz-mcp-20261004. No cubren admira.app (otro sitio).
[[routes]]
pattern = "admira.biz/mcp"
zone_name = "admira.biz"

[[routes]]
pattern = "admira.biz/mcp/*"
zone_name = "admira.biz"

[[routes]]
pattern = "www.admira.biz/mcp"
zone_name = "admira.biz"

[[routes]]
pattern = "www.admira.biz/mcp/*"
zone_name = "admira.biz"

[observability]
enabled = true

# MCP uses the existing canonical mission database and internal service bindings.
[[d1_databases]]
binding = "DB"
database_name = "yokup-tickets"
database_id = "fc2d2810-0fb9-46bb-b05c-14c41fbd1b65"
migrations_dir = "migrations"

[[services]]
binding = "RTC"
service = "yokup-rtc"

[[services]]
binding = "TELEGRAM"
service = "admira-telegram"

# ITIL (FLT-101300 · MorfeoMacMini): el MCP de flota (itil_*) llama a yokup-api por este binding,
# a /internal/itil/* con host yokup-api.internal (solo por binding; sin secreto nuevo). Misma cuenta
# de Cloudflare. ORDEN: desplegar antes yokup-api (migración 0020 + rutas). Ver docs/itil-yokup.md.
[[services]]
binding = "DESK"
service = "yokup-api"
