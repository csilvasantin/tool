<!doctype html><html lang="es"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><style>
:root{color-scheme:light dark;--bg:#f6f8f1;--fg:#173d33;--card:#fff;--accent:#689840}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}button,input,select{font:inherit;border:1px solid #9aa99a;border-radius:16px;background:var(--card);color:var(--fg);padding:10px}button[aria-pressed=true]{background:var(--accent);color:white}header,footer,.row{display:flex;gap:7px;align-items:center}header{padding:8px 0}header button{flex:1;font-size:14px}#account{flex:0 0 44px}#pet{flex:1;min-height:0;border:0;width:100%;pointer-events:none}#stage{flex:1;min-height:70px;display:flex;position:relative;touch-action:none;user-select:none}#hint{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;text-align:center;margin:4px 0;font-size:13px}#answer{max-height:20vh;overflow:auto;margin:6px 0;white-space:pre-wrap}#answer:empty{display:none}input{min-width:0;flex:1}footer{padding-bottom:8px}details{padding:4px 0}#options{max-height:40vh;overflow:auto}.immersion #answer,.immersion details,.immersion footer{display:none}.immersion #stage{min-height:0}#code{font-size:30px;letter-spacing:5px}.row{flex-wrap:wrap;margin:6px 0}.muted{font-size:12px} @media(prefers-color-scheme:dark){:root{--bg:#101715;--fg:#f4f8ed;--card:#20322c}}@media(orientation:landscape){header{padding:3px 0}header button{padding:6px}#answer{max-height:16vh}footer button,footer input{padding:6px}#hint{margin:0}}
</style><header><button data-agent="supervisor">Supervisor</button><button data-agent="admirito" aria-pressed="true">Admirito</button><button data-agent="bugito">Bugito</button><button id="account" aria-label="Cuenta">☰</button></header>
<div id="stage" role="button" tabindex="0" aria-label="Mantén pulsado para hablar"><iframe id="pet" title="Mascota"></iframe></div><p id="hint" role="status">Mantén pulsado para hablar</p><div id="answer" role="log"></div>
<footer><input id="text" maxlength="1800" placeholder="Habla o escribe…"><button id="send">Enviar</button></footer><details id="options"><summary>Cuenta y escuchas</summary><div class="row"><button onclick="Native.pair()">Vincular cuenta</button><button onclick="Native.openAccount()">Aprobar código en admira.app</button><button onclick="Native.unlink()">Desvincular</button><button onclick="Native.history()">Continuar conversación</button></div><p id="code"></p><div class="row"><select id="kind"><option value="meeting">Reunión</option><option value="movie">Película</option></select><button onclick="Native.startListening(document.querySelector('#kind').value)">Iniciar escucha</button><button onclick="Native.finishListening()">Terminar y resumir</button><button onclick="Native.retryListening()">Recuperar pendientes</button></div><div class="row"><button onclick="Native.player()">Player en este Fold</button><button onclick="Native.photo()">Fotografiar proyección</button><button onclick="Native.identify()">Reconocer película</button><button id="wake" onclick="Native.toggleWake()">Activación por voz</button><button onclick="Native.restToggle()">Estimar horario de descanso</button><button onclick="Native.restShow()">Mi horario</button></div><p class="muted">La escucha comienza solo al activarla. La foto se envía solo al pedir reconocer. El horario estima acostarse y primera apertura; no mide sueño.</p><img id="photo" alt="Foto de la proyección" hidden style="max-width:100%;max-height:180px"></details>
<script>
let idle,touch=false;const colors={admirito:'#689840',bugito:'#c83838',supervisor:'#387dac'};
function activity(){document.body.classList.remove('immersion');clearTimeout(idle);Native.immersive(false);idle=setTimeout(()=>{if(!document.querySelector('#options').open){document.body.classList.add('immersion');Native.immersive(true)}},18000)}
function update(event){if(event.status)document.querySelector('#hint').textContent=event.status;if(event.answer){document.querySelector('#answer').textContent=event.answer;document.querySelector('#answer').scrollTop=1e9;activity()}if(event.code){document.querySelector('#code').textContent=event.code;document.querySelector('#options').open=true}if(event.agent){document.querySelectorAll('[data-agent]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.agent===event.agent));document.documentElement.style.setProperty('--accent',colors[event.agent]);document.querySelector('#pet').src='/assets/'+event.agent+'.html'}if(event.photo){document.querySelector('#photo').src=event.photo;document.querySelector('#photo').hidden=false}if(event.wake!==undefined)document.querySelector('#wake').setAttribute('aria-pressed',event.wake)}
const stage=document.querySelector('#stage');stage.onpointerdown=e=>{e.preventDefault();stage.setPointerCapture(e.pointerId);touch=true;Native.hold(true)};stage.onpointermove=e=>{const r=stage.getBoundingClientRect();document.querySelector('#pet').contentWindow.setPetPresentation?.((e.clientX-r.left)/r.width*2-1,(e.clientY-r.top)/r.height*2-1,true)};stage.onpointerup=e=>{if(touch){touch=false;Native.hold(false)}};stage.onpointercancel=()=>{touch=false;Native.cancelHold()};stage.onkeydown=e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();Native.hold(true)}};stage.onkeyup=e=>{if(e.code==='Space')Native.hold(false)};
document.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>Native.select(b.dataset.agent));document.querySelector('#send').onclick=()=>{let text=document.querySelector('#text');Native.command(text.value);text.value=''};document.querySelector('#account').onclick=()=>{activity();document.querySelector('#options').open=!document.querySelector('#options').open};document.addEventListener('click',activity);update({agent:'admirito'});activity();
</script></html>
