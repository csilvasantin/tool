<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Detalle Highscore · Yokup</title>
<meta name="robots" content="noindex,nofollow">
<script src="/acceso.js?v=r2"></script>
<link rel="stylesheet" href="/yk-frame.css?v=r19">
<style>
:root{--bg:#02080d;--card:#0a1620;--card2:#0d1c28;--ink:#dff8ff;--mut:#75aab9;--dim:#4d7a88;
  --brand:#78f3ff;--accent:#ffd866;--good:#88ffaa;--warn:#ff8866;--line:rgba(120,243,255,.18);
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono)}
a{color:var(--brand)}.wrap{max-width:1040px;margin:0 auto;padding:54px 20px 72px}.back{display:inline-flex;align-items:center;gap:8px;
  margin-bottom:24px;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:.08em}.back:hover,.back:focus-visible{color:var(--ink)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:20px;border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(135deg,rgba(13,28,40,.95),rgba(2,8,13,.85));box-shadow:0 18px 52px rgba(0,0,0,.32)}
.avatar{display:grid;place-items:center;width:88px;height:88px;border-radius:18px;border:1px solid rgba(120,243,255,.42);background:#07131b;
  color:var(--brand);font-size:34px;font-weight:950;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.eyebrow{color:var(--dim);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
h1{margin:6px 0 4px;color:var(--brand);font-size:clamp(23px,5vw,42px);word-break:break-word}.source{margin:0;color:var(--mut);font-size:11px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:18px 0}.stat{padding:14px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.stat b{display:block;color:var(--accent);font-size:22px}.stat span{display:block;margin-top:5px;color:var(--dim);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{min-width:0;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.panel h2{margin:0 0 14px;color:var(--brand);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.facts{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.facts a{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--mut)}
.facts a:hover,.facts a:focus-visible{border-color:var(--brand);color:var(--ink)}.facts b{font-size:18px;color:var(--ink)}.empty{margin:0;color:var(--dim);font-size:12px;line-height:1.55}
.timeline{grid-column:1/-1}.hours{display:grid;gap:10px}.hour{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center}.hour time{color:var(--mut);font-size:11px}
.bar{height:12px;border-radius:20px;background:#031018;overflow:hidden}.bar i{display:block;height:100%;min-width:4px;background:linear-gradient(90deg,var(--brand),var(--accent));box-shadow:0 0 10px rgba(120,243,255,.3)}
.hour button{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:11px;cursor:pointer}.hour-detail{grid-column:2/-1;margin:0;padding-left:18px;color:var(--mut);font-size:10px;line-height:1.6}
.hour-detail[hidden]{display:none}.state{padding:28px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.state h1{font-size:22px}.state p{color:var(--mut);line-height:1.6}
@media(max-width:760px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.timeline{grid-column:auto}}
@media(max-width:470px){.wrap{padding:42px 14px 56px}.hero{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}.stats{grid-template-columns:repeat(2,1fr)}.hour{grid-template-columns:50px 1fr auto}}
</style>
</head>
<body data-yk-title="DETALLE HIGHSCORE" data-yk-zone="app">
<main class="wrap">
  <a class="back" href="/highscore" aria-label="Volver al Highscore">← Volver al Highscore</a>
  <div id="content" aria-live="polite"><section class="state"><p>Cargando datos reales…</p></section></div>
</main>
<script src="/yk-agent-identity.js?v=v.2026.08.02.202305"></script>
<script src="/yk-avatar.js?v=v.2026.08.02.202305"></script>
<script src="/highscore-detail.js?v=flt-1150-a1"></script>
<script>
(function () {
  "use strict";
  var API = "https://api.yokup.com", DETAIL = window.YkHighscoreDetail, ID = window.ykAgentIdentity;
  var target = document.getElementById("content"), agent = new URLSearchParams(location.search).get("agent") || "";
  function el(tag, cls, value) { var node = document.createElement(tag); if (cls) node.className = cls; if (value != null) node.textContent = String(value); return node; }
  function state(title, message) { target.replaceChildren(); var box=el("section","state"), h=el("h1","",title), p=el("p","",message); box.append(h,p); target.appendChild(box); }
  function get(url, pick, fallback) { return fetch(url, { cache:"no-store" }).then(function (response) {
    if (!response.ok) throw new Error(response.status); return response.json();
  }).then(function(payload){ return { ok:true, value:pick(payload) }; })
    .catch(function () { return { ok:false, value:fallback }; }); }
  function stat(value, label) { var box=el("div","stat"), strong=el("b","",value), caption=el("span","",label); box.append(strong,caption); return box; }
  function factsPanel(title, rows, emptyText, complete) {
    var panel=el("section","panel"), heading=el("h2","",title); panel.appendChild(heading);
    if (!rows.length) { panel.appendChild(el("p","empty",complete?emptyText:"Datos no disponibles para completar esta sección.")); return panel; }
    var list=el("ul","facts"); rows.forEach(function (row) { var li=el("li"), link=el("a"); link.href=row.href;
      link.append(el("b","",row.value),el("span","",row.label)); li.appendChild(link); list.appendChild(li); }); panel.appendChild(list);
    if (!complete) panel.appendChild(el("p","empty","Resultado parcial: una o más fuentes de datos no están disponibles.")); return panel;
  }
  function timelinePanel(hours, complete) {
    var panel=el("section","panel timeline"), heading=el("h2","","Evolución por horas · eventos observables de hoy (Europe/Madrid)"); panel.appendChild(heading);
    if (!hours.length) { panel.appendChild(el("p","empty",complete?"No hay eventos con hora real atribuibles a este agente durante hoy.":"Datos no disponibles para reconstruir la evolución por horas.")); return panel; }
    var list=el("div","hours"), max=Math.max.apply(null,hours.map(function (hour) { return hour.count; }));
    hours.forEach(function (hour, index) { var row=el("div","hour"), time=el("time","",hour.hour), bar=el("div","bar"), fill=el("i"), button=el("button","",hour.count + (hour.count===1?" evento":" eventos"));
      var detail=el("ul","hour-detail"); detail.id="hour-detail-"+index; detail.hidden=true; fill.style.width=(hour.count/max*100)+"%"; bar.appendChild(fill);
      button.type="button"; button.setAttribute("aria-expanded","false"); button.setAttribute("aria-controls",detail.id);
      button.addEventListener("click",function(){ detail.hidden=!detail.hidden; button.setAttribute("aria-expanded",String(!detail.hidden)); });
      hour.events.forEach(function(event){ detail.appendChild(el("li","",event.type+" · "+event.detail)); }); row.append(time,bar,button,detail); list.appendChild(row); });
    panel.appendChild(list); if (!complete) panel.appendChild(el("p","empty","Evolución parcial: una o más fuentes de datos no están disponibles.")); return panel;
  }
  function render(data) {
    var identitySourcesAvailable=data.available.daily||data.available.tasks||data.available.missions||data.available.incidents;
    var known = !!data.snap || data.daily.scores.some(function(row){ return DETAIL.sameFamily(row.agent,row.machine,agent,ID); }) ||
      data.tasks.some(function(t){ return DETAIL.sameFamily(DETAIL.taskIdentity(t,ID),t.loc,agent,ID); }) ||
      data.missions.some(function(m){ return DETAIL.sameFamily(m.assignee||m.persona,m.machine||m.loc,agent,ID); }) ||
      data.incidents.some(function(i){ return DETAIL.sameFamily(i.assignee||i.persona||i.agent,i.machine||i.loc,agent,ID); });
    if (!known && !identitySourcesAvailable) { state("Datos no disponibles", "No se pudo comprobar esta identidad porque las fuentes del Highscore no están disponibles."); return; }
    if (!known) { state("Agente no encontrado", "La identidad solicitada no aparece en el marcador ni en los datos operativos disponibles."); return; }
    var calculated=DETAIL.scoreFor(agent,data.daily,data.tasks,ID), rank=DETAIL.ranking(agent,data.daily,data.tasks,ID), snap=data.snap;
    var place=snap&&Number(snap.posicion)||rank.place||"—", total=snap&&Number(snap.total);
    if (!Number.isFinite(total)) total=data.available.daily&&data.available.tasks?calculated.total:"—";
    var taskCount=data.available.tasks?calculated.taskCount:"—";
    var fact=DETAIL.facts(agent,data.tasks,data.missions,data.incidents,ID), hours=DETAIL.timeline(agent,data.tasks,data.missions,data.incidents,ID);
    target.replaceChildren(); var hero=el("header","hero"), avatar=el("div","avatar",agent.charAt(0).toUpperCase()), avatarUrl=window.ykAvatar&&window.ykAvatar.img(agent);
    if (avatarUrl) { var image=document.createElement("img"); image.src=avatarUrl; image.alt="Avatar de "+agent; image.addEventListener("error",function(){ image.remove(); avatar.textContent=agent.charAt(0).toUpperCase(); }); avatar.replaceChildren(image); }
    var identity=el("div"), eyebrow=el("div","eyebrow","Identidad canónica"), title=el("h1","",agent), source=el("p","source",snap?"Puesto y puntos del snapshot exacto del Highscore.":"Puesto reconstruido con actividad atribuible directamente; no se reasignan datos sin equipo.");
    identity.append(eyebrow,title,source); hero.append(avatar,identity); target.appendChild(hero);
    var stats=el("section","stats"), scoreAvailable=!!snap||data.available.daily;
    stats.append(stat(place,"Puesto"),stat(total,"Puntos"),stat(snap?snap.objetivos:(scoreAvailable?calculated.objectives:"—"),
      "Objetivos"),stat(snap?snap.ventanas:(scoreAvailable?calculated.windows:"—"),"Ventanas"),
      stat(snap?snap.misiones:(scoreAvailable?calculated.missions:"—"),"Misiones"),stat(snap?snap.tareas:taskCount,"Tareas hoy")); target.appendChild(stats);
    var operationalComplete=data.available.tasks&&data.available.missions&&data.available.incidents;
    var grid=el("div","grid"); grid.append(factsPanel("Lo que hizo bien",fact.good,"No hay hechos positivos verificables en los datos disponibles.",operationalComplete),
      factsPanel("A mejorar",fact.improve,"No hay pendientes o incidencias atribuibles en los datos disponibles.",operationalComplete),
      timelinePanel(hours,operationalComplete)); target.appendChild(grid);
  }
  if (!agent) { state("Falta el agente", "Abre el detalle desde uno de los tres puestos del podio o añade ?agent=<identidad-canónica>."); return; }
  if (!DETAIL.validAgent(agent,ID)) { state("Identidad no válida", "El parámetro agent debe contener una identidad canónica con apellido de equipo, por ejemplo MorfeoMBP16 u OraculoMacMini."); return; }
  var snap=DETAIL.snapshot(agent);
  Promise.all([
    get(API+"/highscore/daily",function(d){return d||{scores:[]};},{scores:[]}),
    get(API+"/tasks/all?scope=fleet",function(d){return d.tasks||[];},[]),
    get(API+"/fleet/missions",function(d){return d.missions||[];},[]),
    get(API+"/tickets?scope=campo&limit=500",function(d){return d.tickets||[];},[])
  ]).then(function(rows){ render({daily:rows[0].value&&rows[0].value.scores?rows[0].value:{scores:[]},tasks:rows[1].value,
      missions:rows[2].value,incidents:rows[3].value,snap:snap,
      available:{daily:rows[0].ok,tasks:rows[1].ok,missions:rows[2].ok,incidents:rows[3].ok}}); });
})();
</script>
<script src="/yk-frame.js?v=r19"></script>
</body>
</html>
