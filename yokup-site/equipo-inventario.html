<!-- 🗂 FICHA DE INVENTARIO DEL EQUIPO (Carlos, 01-10-2026). Desde el «Equipo» de una
     incidencia: las características del equipo averiado tal como están en el
     inventario ITIL de Yokup (la CMDB de los Xpacios): modelo, nº de serie, compra,
     proveedor, garantía (meses, fin e insignia) y estado. Datos: GET
     api.yokup.com/ticket/equipo?id=<incidencia> | ?code=<código ITIL> (tras el acceso
     con Google). Todo entra con textContent. NADA se inventa: lo vacío es «sin dato».
     Si el equipo no está en el inventario, se dice y se ofrece el alta prefijada. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{--ink:#173632;--muted:#667a75;--paper:#f6f8f3;--line:#dbe3d9;--lime:#d8f36a;--dark:#133d32;--dark2:#285444;--green:#4f6e4c;--soft:#eaf0df;--red:#8f2a2a;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--head:Manrope,'DM Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--paper);color-scheme:light}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--green)}
:focus-visible{outline:3px solid #6c985c;outline-offset:3px}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px max(20px,calc((100vw - 1000px)/2));background:#ffffffe6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .brand{font:800 22px/1 var(--head);letter-spacing:-1.2px;color:var(--ink);margin-right:auto;text-decoration:none}
.bar .brand span{color:#84ae44;font-size:12px;padding-left:2px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:600 13px var(--sans);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--paper);border-color:#adc87d}
.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.lime{background:var(--lime);border-color:#c3dc55}
.wrap{max-width:1000px;margin:0 auto;padding:28px 20px 70px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px #153b3016;overflow:hidden}
.hero{position:relative;padding:30px 36px 32px;color:#fff;background:radial-gradient(900px 340px at 85% -10%,#2f6b55 0%,transparent 60%),var(--dark);overflow:hidden}
.eyebrow{font:700 11px/1.3 var(--sans);letter-spacing:2.2px;color:var(--lime);text-transform:uppercase}
.hero h1{margin:12px 0 8px;font:700 clamp(28px,4vw,44px)/1.08 var(--head);letter-spacing:-1.6px;overflow-wrap:anywhere}
.hero .sub{font:500 16px/1.45 var(--sans);color:#d6e8dc;overflow-wrap:anywhere}
.hero-identity{display:flex;align-items:center;gap:22px;min-width:0}
.hero-copy{min-width:0;flex:1}
.hero-photo{display:flex;flex:0 0 148px;width:148px;height:148px;border:1px solid #ffffff70;border-radius:12px;overflow:hidden;align-items:center;justify-content:center;background:#ffffff14;color:#fff;text-align:center;font-size:13px}
.hero-photo img{display:block;width:100%;height:100%;object-fit:cover}
.hero-photo-ref{display:block;margin-top:12px;color:var(--lime);font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}
.hero-photo-scope{margin-top:4px;color:#d6e8dc;font-size:12px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff2e;font:700 12px/1.2 var(--sans);color:#fff}
.chip.code{background:var(--lime);border-color:var(--lime);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.war{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font:800 12.5px/1.2 var(--sans);background:#eef1ea;color:#53635e}
.war[data-w="en_garantia"]{background:#e3f1d3;color:#2f5a22}.war[data-w="vencida"]{background:#f9dede;color:var(--red)}
.war small{font-weight:600;opacity:.85}
.body{padding:26px 32px 30px}
.grp{margin-bottom:22px;break-inside:avoid}
.grp h2{margin-bottom:10px;font:700 17px/1.2 var(--head);letter-spacing:-.4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.f{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
.f dt{font:700 10px/1.3 var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--green)}
.f dd{margin-top:3px;font:700 15px/1.35 var(--sans);overflow-wrap:anywhere}
.f.empty dd{font-weight:500;font-style:italic;color:#98a8a2}
.f.key{background:linear-gradient(180deg,#f4fbd8,#fff);border-color:#d7e2c8}
.note{margin-top:6px;padding:14px 16px;border:1px dashed #c9d5c4;border-radius:12px;font-size:13px;color:var(--muted)}
.miss{padding:28px 32px}
.miss h2{font:800 24px/1.2 var(--head);letter-spacing:-.6px;color:#8f4712}
.miss p{margin-top:10px;color:var(--muted);overflow-wrap:anywhere}
.miss .mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;color:var(--ink)}
.miss ul{margin:12px 0 0 18px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 32px;border-top:1px solid var(--line);background:var(--paper);font:12px var(--sans);color:var(--muted)}
.loading,.err{max-width:560px;margin:60px auto;padding:30px;text-align:center;color:var(--muted)}
.err{border:1px dashed #b8c8a5;border-radius:14px;background:#eaf0e1}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:24px 22px}.body,.miss{padding:20px}}
@media(max-width:460px){.grid{grid-template-columns:minmax(0,1fr)}.btn{flex:1 1 auto;justify-content:center}}
@media(max-width:560px){.hero-identity{align-items:flex-start;gap:14px}.hero-photo{flex-basis:88px;width:88px;height:88px}.hero h1{font-size:26px;letter-spacing:-.8px}}
@page{size:A4;margin:12mm}
@media print{.bar{display:none}.wrap{padding:0;max-width:none}.sheet{border:0;box-shadow:none;border-radius:0}.hero,.war,.chip,.f.key{-webkit-print-color-adjust:exact;print-color-adjust:exact}.f,.grp{break-inside:avoid}}
</style>
<link rel="stylesheet" href="/inventory-shell.css?v=20261001-inventory-1"><script>window.XPACE_SHELL={common:false,twinHome:"https://www.xpaceos.com/admira-xp/",options:[{href:"/retailer#itil",es:"Inventario ITIL",en:"ITIL inventory"},{href:"https://www.xpaceos.com/inventario/",es:"Catálogo XpaceOS",en:"XpaceOS catalogue"},{href:"https://www.xpaceos.com/inventario/starbucks/?view=references",es:"Referencias Starbucks",en:"Starbucks references"},{href:"/incidencias",es:"Incidencias",en:"Incidents"}],advanced:[{href:"/help/#inventory-frame",es:"Ayuda del inventario",en:"Inventory help"},{href:"https://www.xpaceos.com/admira-xp/?play=xtanco&inventory=1",es:"Abrir Xperience",en:"Open Xperience"}]};</script><script defer src="/inventory-shell.js?v=20261001-inventory-1" data-section="/ inventario" data-section-en="/ inventory"></script><link rel="stylesheet" href="/inventory-frame.css?v=inventory-frame-2"></head>
<body data-inventory-host="yokup" data-inventory-page="equipment">
<header class="bar" aria-label="Acciones de la ficha">
  <a class="brand" href="/incidencias" title="Yokup · incidencias">yokup<span>●</span></a>
  <a class="btn" id="fBack" href="/incidencias">← Incidencias</a>
  <a class="btn lime" id="fEdit" href="/retailer#itil" hidden>✎ Abrir en Inventario ITIL ↗</a>
  <button class="btn primary" type="button" id="fPrint">🖨 Imprimir / PDF</button>
</header>
<main class="wrap" id="root"><div class="loading" role="status">🗂 Buscando el equipo en el inventario…</div></main>
<script src="/yk-equipo.js?v=r1"></script>
<script src="/yk-photo-references.js?v=20261001"></script>
<script>
(function(){
"use strict";
const WORKER="https://api.yokup.com";
const qs=new URLSearchParams(location.search), ticket=qs.get("ticket")||"", code=qs.get("code")||"";
const $=x=>document.getElementById(x), E=window.YkEquipo, PHOTOS=window.YkPhotoReferences;
function el(tag,cls,text){ const n=document.createElement(tag); if(cls)n.className=cls; if(text!=null)n.textContent=text; return n; }
function link(cls,href,text){ const a=el("a",cls,text); a.href=href; return a; }
const KEY=new Set(["Modelo","Nº de serie","Fecha de compra","Estado de la garantía","Fin de garantía","Estado"]);
function ficha(r){
  const ci=r.ci, lc=ci.lifecycle||{}, g=E.garantia(lc), x=r.xpacio||{};
  document.title=(ci.itil_code||"Equipo")+" · "+(ci.name||"")+" · Inventario · Yokup";
  const sheet=el("article","sheet"); sheet.setAttribute("aria-label","Ficha de inventario del equipo");
  const hero=el("header","hero");
  const identity=el("div","hero-identity"),copy=el("div","hero-copy");
  copy.append(el("p","eyebrow","Inventario ITIL · ficha del equipo"),el("h1",null,ci.name||"Equipo"),
    el("p","sub",[E.CATEGORIA[ci.category]||ci.category,x.name,x.city,x.admira_store_id?"Xpacio "+x.admira_store_id:""].filter(Boolean).join(" · ")));
  identity.append(copy);hero.append(identity);
  const chips=el("div","chips");
  if(ci.itil_code) chips.append(el("span","chip code",ci.itil_code));
  const w=el("span","war"); w.dataset.w=g.estado; w.id="fWar"; w.append("🛡 "+(g.estado==="sin_dato"?"Garantía: sin dato":g.label)); if(g.estado!=="sin_dato"){ w.append(" "); w.append(el("small",null,"· "+g.detalle)); } chips.append(w);
  chips.append(el("span","chip",E.ESTADO[lc.status]||lc.status||"Operativo"));
  if(ci.open_incidents) chips.append(el("span","chip",ci.open_incidents===1?"1 incidencia abierta":ci.open_incidents+" incidencias abiertas"));
  hero.append(chips); sheet.append(hero);
  const body=el("div","body"); const groups=new Map();
  for(const c of E.campos(ci)){ if(!groups.has(c.grupo)) groups.set(c.grupo,[]); groups.get(c.grupo).push(c); }
  for(const [name,items] of groups){
    const sec=el("section","grp"); sec.append(el("h2",null,name)); const dl=el("dl","grid");
    for(const c of items){ const f=el("div","f"+(c.vacio?" empty":"")+(KEY.has(c.k)&&!c.vacio?" key":"")); f.append(el("dt",null,c.k),el("dd",null,c.v)); dl.append(f); }
    sec.append(dl); body.append(sec);
  }
  const vacios=E.campos(ci).filter(c=>c.vacio).length;
  body.append(el("p","note",(vacios?vacios+" campos sin dato: se completan con la factura, el albarán o el parte de instalación desde «Abrir en Inventario ITIL». ":"")+"Encontrado por "+({itil_code:"código ITIL",portal:"la incidencia del Portal del comercio",device:"id del equipo",censo:"id del censo",superficie:"superficie del Xpacio",nombre:"nombre igual al del equipo de la incidencia",categoria:"categoría única en el Xpacio"}[r.match]||r.match)+(r.ref?" · Equipo de la incidencia: "+r.ref:"")+"."));
  sheet.append(body);
  const foot=el("footer","foot"); foot.append(el("span",null,"yokup● · Inventario ITIL de los Xpacios (CMDB) · datos privados del comercio"),el("span",null,"Actualizado "+(ci.updated_at?new Date(ci.updated_at).toLocaleString("es-ES"):"—")+(ci.updated_by?" · "+ci.updated_by:"")));
  sheet.append(foot);
  $("root").replaceChildren(sheet);
  const edit=$("fEdit"); edit.href=E.inventarioUrl(r); edit.hidden=false;
  if(PHOTOS?.siteMatches(x))PHOTOS.load().then(manifest=>{
    if(!identity.isConnected)return;const ref=PHOTOS.resolve(manifest,x,ci);if(!ref)return;
    const a=link("hero-photo",ref.href,null),img=el("img");a.target="_blank";a.rel="noopener";a.setAttribute("aria-label","Abrir referencia "+ref.id+" · "+ci.name);
    img.src=ref.photo;img.alt="Foto real · "+ci.name+" · "+ref.scopeLabel;img.width=148;img.height=148;img.referrerPolicy="no-referrer";
    img.onerror=()=>a.replaceChildren(el("span",null,"Foto no disponible"));a.append(img);identity.prepend(a);
    copy.append(el("span","hero-photo-ref",ref.id),el("p","hero-photo-scope",ref.scopeLabel));
  });
}
function falta(r){
  const sheet=el("article","sheet"), box=el("div","miss");
  box.append(el("p","eyebrow","Inventario ITIL"),el("h2",null,"⚠ "+E.motivo(r)));
  const p=el("p",null,"Equipo de la incidencia: "); p.append(el("span","mono",r.ref||(r.ticket&&r.ticket.screen)||"sin equipo")); box.append(p);
  if(r.xpacio&&r.xpacio.name) box.append(el("p",null,"Establecimiento: "+r.xpacio.name+(r.xpacio.admira_store_id?" · Xpacio "+r.xpacio.admira_store_id:"")));
  if(r.reason==="ambiguo"&&r.candidates&&r.candidates.length){ const ul=el("ul"); for(const c of r.candidates){ const li=el("li"); li.append(link("",E.fichaUrl({code:c.itil_code}),c.itil_code+" · "+c.name+(c.position?" · "+c.position:""))); ul.append(li);} box.append(el("p",null,"Equipos posibles en ese Xpacio:"),ul); }
  box.append(el("p",null,"No se muestran características porque el inventario no tiene este equipo. El alta se abre prefijada con el establecimiento, la categoría y el nombre que salen del propio id; el número de serie, la compra y la garantía se rellenan con datos reales."));
  const acts=el("div","acts"); acts.append(link("btn lime",E.altaUrl(r,ticket),r.reason==="sin_ficha"?"＋ Convertir en CI del inventario ↗":"＋ Darlo de alta en el inventario ↗")); box.append(acts);
  sheet.append(box); $("root").replaceChildren(sheet);
}
async function main(){
  $("fPrint").onclick=()=>window.print();
  if(ticket){ $("fBack").href="/ticket?id="+encodeURIComponent(ticket); $("fBack").textContent="← Incidencia "+ticket; }
  if(!ticket&&!code){ $("root").replaceChildren(el("div","err","Falta la incidencia o el código: /equipo-inventario?ticket=INC-… o ?code=PDG103-PAN-01")); return; }
  let r=null;
  try{ const res=await fetch(WORKER+"/ticket/equipo?"+(ticket?"id="+encodeURIComponent(ticket):"code="+encodeURIComponent(code)),{cache:"no-store"}); r=await res.json(); }catch(e){}
  if(!r||!r.ok){ $("root").replaceChildren(el("div","err",r&&r.error==="not-found"?"Incidencia no encontrada.":"El inventario no está disponible ahora. Inténtalo en unos segundos.")); return; }
  if(r.found&&r.ci) ficha(r); else falta(r);
}
main();
})();
</script>
