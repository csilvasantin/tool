<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Informe de incidencia · Yokup · AdmiraNeXT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#133d32">
<!-- 📄 INFORME DE INCIDENCIA (Carlos, 01-10-2026). Vista HTML compartible e
     imprimible (PDF) de una incidencia de Yokup: cabecera, establecimiento,
     equipo, gravedad, duración, responsable, KPIs, Resumen IA, línea de tiempo
     del historial y resolución. Datos: GET api.yokup.com/ticket?id= (tras el
     acceso con Google) y POST /ai-summary (la lógica del botón «Resumen IA»).
     Todo dato entra con textContent/esc: nada del ticket se interpreta como HTML.
     NADA se envía solo: «Enviar por correo» abre un mailto: sin destinatarios. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{
  --ink:#173632;--muted:#667a75;--paper:#f6f8f3;--line:#dbe3d9;--line2:#c9d5c4;--lime:#d8f36a;--dark:#133d32;--dark2:#285444;
  --red:#ac3838;--accent:#67935c;--green:#4f6e4c;--live:#7aab49;--soft:#eaf0df;--soft-line:#d7e2c8;--amber:#d9a21b;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--head:Manrope,'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper);color-scheme:light}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--green)}
:focus-visible{outline:3px solid #6c985c;outline-offset:3px}

/* ---------- Barra de acciones (no se imprime) ---------- */
.rp-toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px max(20px,calc((100vw - 1040px)/2));background:#ffffffe6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.rp-toolbar .brand{font:800 22px/1 var(--head);letter-spacing:-1.2px;color:var(--ink);margin-right:auto;text-decoration:none}
.rp-toolbar .brand span{color:#84ae44;font-size:12px;padding-left:2px;letter-spacing:0}
.rp-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:600 13px var(--sans);text-decoration:none;cursor:pointer;transition:transform .15s,background .15s,border-color .15s}
.rp-btn:hover{background:var(--paper);border-color:#adc87d;transform:translateY(-1px)}
.rp-btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.rp-btn.primary:hover{background:var(--dark2);color:var(--lime)}
.rp-btn.lime{background:var(--lime);border-color:#c3dc55}
.rp-msg{font:600 13px var(--sans);color:var(--green);min-width:0}

/* ---------- Hoja ---------- */
.rp{max-width:1040px;margin:0 auto;padding:28px 20px 70px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 80px #153b3016;overflow:hidden}

/* Cabecera */
.hero{position:relative;padding:34px 40px 38px;color:#fff;background:radial-gradient(1200px 400px at 85% -10%,#2f6b55 0%,transparent 60%),radial-gradient(700px 300px at -10% 120%,#1f5a47 0%,transparent 60%),var(--dark);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(180deg,#000 0%,transparent 95%)}
.hero::after{content:"";position:absolute;z-index:-1;width:520px;height:520px;right:-160px;top:-260px;border-radius:50%;background:radial-gradient(circle,#d8f36a40 0%,transparent 65%);animation:glow 7s ease-in-out infinite alternate}
@keyframes glow{from{transform:translate(0,0) scale(1)}to{transform:translate(-60px,40px) scale(1.15)}}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.marks{display:flex;align-items:center;gap:12px;font:800 15px/1 var(--head);letter-spacing:.3px}
.marks .an{letter-spacing:-.2px}.marks .an b{color:var(--lime)}
.marks .sep{width:1px;height:18px;background:#ffffff40}
.marks .yk{font-size:19px;letter-spacing:-1px}.marks .yk span{color:var(--lime);font-size:10px;padding-left:2px}
.rp-num{font:600 11px/1.3 var(--sans);letter-spacing:1.6px;text-transform:uppercase;color:#cfe5d6;text-align:right}
.rp-num b{display:block;color:#fff;font-size:12px;letter-spacing:1.2px}
.hero-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;margin-top:34px}
.eyebrow{display:flex;align-items:center;gap:9px;font:700 11px/1.3 var(--sans);letter-spacing:2.2px;color:var(--lime)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 #d8f36a99;animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #d8f36a99}70%{box-shadow:0 0 0 12px #d8f36a00}100%{box-shadow:0 0 0 0 #d8f36a00}}
.hero h1{margin:14px 0 10px;font:700 clamp(30px,4.4vw,50px)/1.05 var(--head);letter-spacing:-2px;overflow-wrap:anywhere}
.hero .sub{font:500 17px/1.45 var(--sans);color:#d6e8dc}
.hero .sub b{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff2e;font:700 12px/1.2 var(--sans);letter-spacing:.3px;color:#fff}
.chip[data-sev="urgente"]{background:var(--red);border-color:var(--red)}
.chip[data-sev="alta"]{background:#fdecd9;border-color:#fdecd9;color:#8f4712}
.chip[data-sev="normal"]{background:#edf3df;border-color:#edf3df;color:var(--green)}
.chip.proj{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.stamp{position:relative;display:grid;place-items:center;width:150px;height:150px;border-radius:50%;border:3px solid var(--lime);color:var(--lime);text-align:center;transform:rotate(-8deg)}
.stamp::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1px dashed #d8f36a99}
.stamp b{display:block;font:800 19px/1.05 var(--head);letter-spacing:.5px;text-transform:uppercase}
.stamp small{display:block;margin-top:5px;font:700 10px/1.2 var(--sans);letter-spacing:1.5px;color:#e9f6c0}
.stamp[data-state="live"]{border-color:#ffc56b;color:#ffc56b}.stamp[data-state="live"]::before{border-color:#ffc56b99}
.stamp[data-state="cancel"]{border-color:#c9d5c4;color:#c9d5c4}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.kpi{position:relative;padding:22px 24px 20px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi dt{font:700 10px/1.3 var(--sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--green)}
.kpi dd{margin-top:8px;font:800 30px/1.05 var(--head);letter-spacing:-1.2px;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi dd.small{font-size:22px;letter-spacing:-.6px}
.kpi p{margin-top:6px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.kpi.hl{background:linear-gradient(180deg,#f4fbd8,#fff)}
.kpi.hl::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--lime)}
.ok{color:#3f6b2f}.ko{color:var(--red)}.wait{color:#865c00}
.ring{position:absolute;right:18px;top:18px;width:42px;height:42px}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:#e7eee0}.ring .fg{stroke:var(--live);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring.ko .fg{stroke:var(--red)}

/* Cuerpo */
.body{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr);gap:0}
.col{padding:28px 32px;min-width:0}
.col+.col{border-left:1px solid var(--line);background:#fbfcf8}
.sec{margin-bottom:28px;break-inside:avoid}
.sec:last-child{margin-bottom:0}
.sec h2{display:flex;align-items:center;gap:10px;margin-bottom:14px;font:700 19px/1.2 var(--head);letter-spacing:-.5px}
.sec h2 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--green);font:800 12px var(--sans)}
.data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.datum{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
.datum dt{font:700 10px/1.3 var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--green)}
.datum dd{margin-top:3px;font:700 15px/1.35 var(--sans);overflow-wrap:anywhere}
.datum dd.sub{font:13px/1.4 var(--sans);color:var(--muted)}
.datum.wide{grid-column:1/-1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600}

/* Resumen IA */
.ai{position:relative;padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,#133d32,#1f5a47);color:#eaf6ee;overflow:hidden}
.ai::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#d8f36a33,transparent 70%)}
.ai h3{display:flex;align-items:center;gap:8px;font:700 11px/1.3 var(--sans);letter-spacing:1.8px;text-transform:uppercase;color:var(--lime);margin-bottom:10px}
.ai p{position:relative;z-index:1;font:500 15.5px/1.65 var(--sans);white-space:pre-wrap}
.ai .caret{display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:var(--lime);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ai .meta{position:relative;z-index:1;margin-top:10px;font-size:11.5px;color:#b9d4c3}
.shim{display:block;height:12px;margin:8px 0;border-radius:6px;background:linear-gradient(90deg,#ffffff1a,#ffffff40,#ffffff1a);background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}

/* Barra de tiempo */
.span{position:relative;margin:6px 0 22px;padding:16px 16px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.span-h{display:flex;justify-content:space-between;gap:8px;font:600 12px var(--sans);color:var(--muted)}
.span-h b{color:var(--ink)}
.track{position:relative;height:10px;margin:14px 4px 10px;border-radius:999px;background:#eef3e8}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:linear-gradient(90deg,var(--live),var(--lime));transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.track .fill.live{background:linear-gradient(90deg,#e0a43b,#ffd27a)}
.track .mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid var(--dark);opacity:0;transform:scale(.3);transition:opacity .4s,transform .4s cubic-bezier(.3,1.6,.5,1)}
.track .mk.on{opacity:1;transform:scale(1)}
.track .mk.ai{border-color:var(--accent)}.track .mk.recover,.track .mk.status{border-color:var(--live)}.track .mk.log{border-color:#e0892b}
.span-f{display:flex;justify-content:space-between;font:12px var(--sans);color:var(--muted)}

/* Línea de tiempo */
.tl{list-style:none}
.ev{position:relative;padding:0 0 20px 40px}
.ev::before{content:"";position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px #e6f0d8}
.ev::after{content:"";position:absolute;left:10px;top:28px;bottom:2px;width:2px;background:#cfe0bb}
.ev:last-child{padding-bottom:0}.ev:last-child::after{display:none}
.ev.ai::before{background:var(--accent)}.ev.log::before{background:#e0892b;box-shadow:0 0 0 4px #fbe9d6}
.ev.assign::before{background:var(--dark)}.ev.note::before{background:var(--green)}
.ev .ic{position:absolute;left:0;top:1px;width:22px;height:22px;display:grid;place-items:center;font-size:11px;z-index:1}
.ev .eh{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.ev .eh b{font:700 15px/1.3 var(--head)}
.ev .eh time{font:600 12.5px var(--sans);color:var(--muted)}
.ev .eh .off{font:700 11px var(--sans);padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--green)}
.ev .et{margin-top:3px;font:14px/1.6 var(--sans);white-space:pre-wrap;overflow-wrap:anywhere}
.ev-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ev-imgs a{display:block;width:120px;height:86px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.ev-imgs img{width:100%;height:100%;object-fit:cover;display:block}
.ev.pending::before{background:#fff;border:2px solid #cbd7c4;box-shadow:none}
.ev.pending .eh b,.ev.pending .et{color:var(--muted)}

/* Lateral: resolución, responsable, firma */
.res{padding:18px 20px;border-radius:14px;border:1px solid var(--soft-line);background:var(--soft)}
.res.live{background:#fff7e6;border-color:#f3dcae}
.res .big{display:flex;align-items:center;gap:10px;font:800 20px/1.2 var(--head);letter-spacing:-.5px}
.res .big .tick{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--live);color:#fff;font-size:18px;flex:0 0 auto}
.res.live .big .tick{background:#e0a43b}
.res p{margin-top:10px;font:14px/1.6 var(--sans);white-space:pre-wrap;overflow-wrap:anywhere}
.res .by{margin-top:8px;font:600 12.5px var(--sans);color:var(--muted)}
.person{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.person .av{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--lime),#a9d36a);font:800 20px var(--head);color:var(--ink);flex:0 0 auto}
.person b{display:block;font:800 17px/1.2 var(--head)}
.person span{font-size:13px;color:var(--muted)}
.facts{list-style:none;border-top:1px solid var(--line)}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.facts li span{color:var(--muted)}.facts li b{text-align:right;overflow-wrap:anywhere}
.sign{margin-top:8px;padding:16px;border:1px dashed var(--line2);border-radius:14px;font-size:12.5px;line-height:1.55;color:var(--muted)}
.sign b{color:var(--ink)}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 32px;border-top:1px solid var(--line);background:var(--paper);font:12px var(--sans);color:var(--muted)}
.foot b{font:800 15px var(--head);letter-spacing:-.6px;color:var(--ink)}.foot b span{color:#84ae44;font-size:9px}

/* Carga y errores */
.loading{display:grid;place-items:center;gap:14px;min-height:60vh;text-align:center;color:var(--muted)}
.loading .orb{width:64px;height:64px;border-radius:50%;background:conic-gradient(from 0deg,var(--lime),var(--live),var(--dark),var(--lime));animation:spin 1.1s linear infinite;-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%);mask:radial-gradient(circle,transparent 52%,#000 54%)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading b{font:800 22px var(--head);letter-spacing:-.6px;color:var(--ink)}
.err{max-width:560px;margin:60px auto;padding:30px;border:1px dashed #b8c8a5;border-radius:14px;background:#eaf0e1;text-align:center;color:var(--muted)}

/* ---------- Revelado animado ---------- */
.rv{opacity:0;transform:translateY(22px) scale(.985)}
body.ready .rv{animation:rvIn .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0) * 95ms)}
@keyframes rvIn{to{opacity:1;transform:none}}
body.ready .stamp{animation:stampIn .9s cubic-bezier(.3,1.7,.5,1) .55s both}
@keyframes stampIn{from{opacity:0;transform:rotate(-30deg) scale(2.2)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
body.ready .ev{animation:rvIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(700ms + var(--e,0) * 80ms);opacity:0;transform:translateX(-14px)}
body.rp-static .rv,body.rp-static .ev,body.rp-static .stamp{opacity:1!important;transform:none!important;animation:none!important}
body.rp-static .stamp{transform:rotate(-8deg)!important}

@media screen and (max-width:860px){
  .hero{padding:26px 22px 30px}.hero-main{grid-template-columns:minmax(0,1fr)}.stamp{width:120px;height:120px;justify-self:start}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .body{grid-template-columns:minmax(0,1fr)}.col{padding:22px 20px}.col+.col{border-left:0;border-top:1px solid var(--line)}
  .rp{padding:16px 12px 50px}.rp-toolbar .brand{width:100%}
}
@media screen and (max-width:520px){.data{grid-template-columns:minmax(0,1fr)}.kpi dd{font-size:24px}.rp-btn{flex:1 1 auto;justify-content:center}}
@media(prefers-reduced-motion:reduce){
  .rv,.ev,.stamp{opacity:1!important;transform:none!important;animation:none!important}
  .stamp{transform:rotate(-8deg)!important}
  .hero::after,.eyebrow i,.ai .caret,.shim,.loading .orb{animation:none}
  .track .fill,.ring .fg,.track .mk{transition:none}
}

/* ---------- Impresión / PDF ---------- */
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff}
  body{font-size:12.5px}
  .rp-toolbar,.no-print{display:none!important}
  .rp{max-width:none;padding:0}
  .sheet{border:0;border-radius:0;box-shadow:none}
  .rv,.ev,.stamp{opacity:1!important;transform:none!important;animation:none!important}
  .stamp{transform:rotate(-8deg)!important}
  .hero,.ai,.kpi.hl,.chip,.track .fill,.ev::before,.person .av,.res .tick,.stamp{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hero::after{animation:none}
  .hero{padding:24px 26px 26px}.hero h1{font-size:32px;letter-spacing:-1.2px}
  .track .mk{opacity:1;transform:none}
  .ai .caret{display:none}
  .hero-main{grid-template-columns:minmax(0,1fr) auto;margin-top:22px}.stamp{width:118px;height:118px}
  .kpi{padding:16px 16px 14px}.kpi dd{font-size:24px}.kpi dd.small{font-size:18px}
  /* En papel el cuerpo fluye en una columna (las rejillas no se parten bien entre páginas) */
  .body{display:block}
  .col{padding:18px 24px}
  .col+.col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;border-left:0;border-top:1px solid var(--line);background:#fff}
  .col+.col .sec{margin:0}
  .col+.col .sec:last-child{grid-column:1/-1}
  .data{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .datum{padding:10px 12px}
  .datum.wide{grid-column:span 3}
  .ai{padding:16px 18px}.ai p{font-size:13.5px}
  .facts li{padding:6px 0;font-size:12px}
  .res{padding:14px 16px}.res .big{font-size:16px}
  .sec{margin-bottom:18px}
  .sec h2{break-after:avoid}
  .datum,.kpi,.res,.person,.ev,.span,.ai,.facts li,.sign{break-inside:avoid}
  .ev-imgs a{width:96px;height:70px}
  a{text-decoration:none;color:inherit}
}
</style>
</head>
<body>
<header class="rp-toolbar" aria-label="Acciones del informe">
  <a class="brand" href="/incidencias" title="Yokup · incidencias">yokup<span>●</span></a>

  <button class="rp-btn" type="button" id="rpCopy">🔗 Copiar enlace</button>

</header>

<script src="/yk-duracion.js?v=r1"></script>
<script>
(function(){
"use strict";
const WORKER="https://api.yokup.com";
const qs=new URLSearchParams(location.search);
const id=qs.get("id")||"";
const PRINT=qs.get("print")==="1";
const D=window.YkDuracion;
const $=x=>document.getElementById(x);
function esc(x){ return String(x==null?"":x).replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c])); }
function ms(v){ return D?D.toMs(v):Number(v)||null; }
const p2=n=>(n<10?"0":"")+n;
function fecha(v){ const t=ms(v); if(!t)return "—"; const d=new Date(t); return p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()+" "+p2(d.getHours())+":"+p2(d.getMinutes()); }
function hora(v){ const t=ms(v); if(!t)return ""; const d=new Date(t); return p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds()); }
const SEV_ALIAS={urgent:"urgente",high:"alta",medium:"normal",media:"normal",low:"baja"};
const SEV_LABEL={urgente:"Urgente",alta:"Alta",normal:"Normal",baja:"Baja"};
const ESTADO={open:"Abierta",in_progress:"En curso",resolved:"Finalizada",cancelled:"Eliminada",done:"Finalizada"};
const ICON={log:"🤖",assign:"🧭",ai:"🧠",note:"👷",status:"🔄",recover:"✅",race_bonus:"🏁"};
function sevOf(p){ const k=String(p||"").trim().toLowerCase(); return SEV_ALIAS[k]||k; }
function informeUrl(){ return location.origin+"/informe-incidencia?id="+encodeURIComponent(id); }
// «Estado → resolved: nota» se lee en castellano
function textoEvento(e){ return String(e.text==null?"":e.text).replace(/^Estado → ([a-z_]+)/,(m,s)=>"Estado → "+(ESTADO[s]||s)); }
// Adjuntos: las imágenes viajan como URLs dentro del texto (como en /ticket)
const RE_IMG=/https?:\/\/[^\s<>"]+?(?:\/media\/[^\s<>"]*|\.(?:png|jpe?g|gif|webp|avif))/gi;
function cuerpo(e){
  const t=textoEvento(e), urls=[...new Set(t.match(RE_IMG)||[])];
  if(!urls.length) return '<div class="et">'+esc(t)+'</div>';
  const limpio=t.replace(/\n*🖼[^\n]*\n?/g,"\n").split(RE_IMG).join(" ").replace(/^[ \t]*[-•]?[ \t]*$/gm,"").replace(/\n{3,}/g,"\n\n").trim();
  return (limpio?'<div class="et">'+esc(limpio)+'</div>':"")+'<div class="ev-imgs">'+urls.map(u=>/^https:\/\//.test(u)?'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="adjunto" loading="eager"></a>':"").join("")+'</div>';
}
function iniciales(n){ const s=String(n||"").replace(/[^\p{L}\s.]/gu,"").trim(); if(!s)return "?"; const p=s.split(/\s+/); return ((p[0][0]||"")+(p.length>1?(p[1][0]||""):"")).toUpperCase(); }
function msg(t){ $("rpMsg").textContent=t; if(t) setTimeout(()=>{ if($("rpMsg").textContent===t) $("rpMsg").textContent=""; },4000); }

let T=null, EV=[], SUMMARY="";
function mailto(){
  const t=T||{}, dur=D&&T?D.etiqueta(t):"";
  const lines=["Hola,","","Te comparto el informe de la incidencia "+id+":","«"+(t.subject||"(sin asunto)")+"»",
    [t.project_name||t.project,t.loc].filter(Boolean).join(" · "),dur?"⏱ "+dur:"",
    SUMMARY?"\nResumen IA: "+SUMMARY:"","","Informe completo (línea de tiempo, duración y resumen IA):",informeUrl(),"","— Yokup · AdmiraNeXT"];
  return "mailto:?subject="+encodeURIComponent("Informe de incidencia "+id+" · "+(t.subject||""))+"&body="+encodeURIComponent(lines.filter((l,i,a)=>l!==""||a[i-1]!=="").join("\n"));
}
function wireToolbar(){
  $("rpBack").href=id?"/ticket?id="+encodeURIComponent(id):"/incidencias";
  $("rpMail").href=mailto();
  $("rpPrint").onclick=()=>{ document.body.classList.add("rp-static"); window.print(); };
  $("rpCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(informeUrl()); msg("✓ Enlace copiado"); }catch(e){ window.prompt("Copia el enlace del informe:",informeUrl()); } };
  if(navigator.share){ $("rpShare").hidden=false; $("rpShare").onclick=()=>navigator.share({title:"Informe de incidencia "+id,text:(T&&T.subject)||"",url:informeUrl()}).catch(()=>{}); }
  $("rpDownload").onclick=descargar;
}
// Copia autónoma: el informe ya pintado, sin scripts ni barra, con todo visible.
function descargar(){
  if(!T) return;
  const doc=document.documentElement.cloneNode(true);
  doc.classList.remove("yk-locked");
  doc.querySelectorAll("script,.rp-toolbar,#yk-gate").forEach(n=>n.remove());
  const body=doc.querySelector("body"); body.classList.add("ready","rp-static");
  const html="<!DOCTYPE html>\n"+doc.outerHTML;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
  a.download="informe-"+id+".html"; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  msg("✓ Informe descargado");
}

function kpiCountUp(el,target,fmt,dur){
  if(!el) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||document.body.classList.contains("rp-static")||PRINT){ el.textContent=fmt(target); return; }
  const t0=performance.now();
  const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=fmt(target*e); if(k<1) requestAnimationFrame(step); };
  el.textContent=fmt(0); requestAnimationFrame(step);
}

function render(){
  const t=T, ev=EV;
  const st=String(t.status||"open");
  const cerrada=D?D.cerrada(t):st==="resolved";
  const cancel=st==="cancelled";
  const dur=D?D.duracion(t):null;
  const sev=sevOf(t.priority), sevLabel=SEV_LABEL[sev]||t.priority||"Sin gravedad";
  const proyecto=t.project_name||t.project||"Sin proyecto";
  const establecimiento=t.loc||"";
  const sla=D?D.sla(t):null;
  const aten=D?D.atencion(t):null;
  // primera respuesta: started_at o la primera nota/estado de una persona
  const inicio=dur?dur.inicio:ms(t.created_at);
  const primera=aten!=null?aten:(()=>{ const e=ev.find(x=>/^(note|status|assign)$/.test(x.kind)&&ms(x.ts)>=inicio); return e?ms(e.ts)-inicio:null; })();
  const notas=ev.filter(e=>e.kind==="note").length;
  const fotos=ev.reduce((n,e)=>n+((String(e.text||"").match(RE_IMG)||[]).length),0);
  const finEv=[...ev].reverse().find(e=>e.kind==="status"&&/resolved|cancelled/.test(e.text||""))||[...ev].reverse().find(e=>e.kind==="recover");
  const fin=dur&&dur.fin;
  const ahora=new Date();
  const num="RPT-"+id+"-"+ahora.getFullYear()+p2(ahora.getMonth()+1)+p2(ahora.getDate());
  const estado=ESTADO[st]||st;
  const pct=sla?Math.min(1,sla.ms/sla.sla):0;
  const C=2*Math.PI*17;
  document.title="Informe "+id+" · "+(t.subject||"incidencia")+" · Yokup";

  // marcadores proporcionales sobre la duración
  const total=dur&&dur.ms>0?dur.ms:0;
  const marks=ev.map((e,i)=>{ const x=total?Math.max(0,Math.min(1,(ms(e.ts)-inicio)/total)):(ev.length>1?i/(ev.length-1):0); return '<i class="mk '+esc(e.kind)+'" style="left:'+(x*100).toFixed(2)+'%" title="'+esc(hora(e.ts)+" · "+(e.author||""))+'"></i>'; }).join("");

  const hitos=ev.map((e,i)=>{
    const off=inicio&&ms(e.ts)?"+"+(D?D.formato(Math.max(0,ms(e.ts)-inicio)):""):"";
    return '<li class="ev '+esc(e.kind)+'" style="--e:'+i+'"><span class="ic" aria-hidden="true">'+(ICON[e.kind]||"•")+'</span><div class="eh"><b>'+esc(e.author||"—")+'</b><time>'+esc(hora(e.ts))+'</time>'+(off?'<span class="off">'+esc(off)+'</span>':"")+'</div>'+cuerpo(e)+'</li>';
  }).join("")+(cerrada?"":'<li class="ev pending" style="--e:'+ev.length+'"><div class="eh"><b>Pendiente</b></div><div class="et">Resolver la incidencia y confirmar que el equipo funciona.</div></li>');

  const slaTxt=!sla?"—":sla.viva?(sla.ok?"Quedan "+D.formato(sla.restante):"Vencido"):(sla.ok?"Cumplido":"Excedido");
  const slaCls=!sla?"":sla.viva?(sla.ok?"wait":"ko"):(sla.ok?"ok":"ko");
  const slaSub=!sla?"Sin fecha de creación":sla.ok?(sla.viva?"de 2 h desde la apertura":"Resuelta dentro de las 2 h"):"+"+D.formato(Math.abs(sla.restante))+" sobre las 2 h";

  $("rp").innerHTML=`
  <article class="sheet" aria-label="Informe de la incidencia">
    <header class="hero">
      <div class="hero-top rv" style="--i:0">
        <div class="marks"><span class="an">Admira<b>NeXT</b></span><span class="sep"></span><span class="yk">yokup<span>●</span></span></div>
        <div class="rp-num">Informe de incidencia<b id="rNum"></b></div>
      </div>
      <div class="hero-main">
        <div>
          <p class="eyebrow rv" style="--i:1"><i aria-hidden="true"></i><span id="rEyebrow"></span></p>
          <h1 class="rv" style="--i:2" id="rTitle"></h1>
          <p class="sub rv" style="--i:3" id="rSub"></p>
          <div class="chips rv" style="--i:4">
            <span class="chip proj" id="rProj"></span>
            <span class="chip" id="rSev" data-sev="${esc(sev)}"></span>
            <span class="chip" id="rDurChip"></span>
          </div>
        </div>
        <div class="stamp" data-state="${cancel?"cancel":cerrada?"done":"live"}"><div><b id="rStamp"></b><small id="rStampSub"></small></div></div>
      </div>
    </header>

    <dl class="kpis">
      <div class="kpi hl rv" style="--i:5"><dt>${dur&&dur.viva?"Abierta desde hace":"Duración total"}</dt><dd id="kDur">—</dd><p id="kDurSub"></p></div>
      <div class="kpi rv" style="--i:6"><dt>Primera respuesta</dt><dd class="small" id="kFirst">—</dd><p>${aten!=null?"hasta empezar el trabajo":"hasta la primera intervención"}</p></div>
      <div class="kpi rv" style="--i:7"><dt>SLA · 2 h</dt><dd class="small ${slaCls}">${esc(slaTxt)}</dd><p>${esc(slaSub)}</p>
        <svg class="ring ${sla&&!sla.ok?"ko":""}" viewBox="0 0 42 42" aria-hidden="true"><circle class="bg" cx="21" cy="21" r="17"/><circle class="fg" id="kRing" cx="21" cy="21" r="17" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}"/></svg></div>
      <div class="kpi rv" style="--i:8"><dt>Actividad</dt><dd id="kEv">0</dd><p>${ev.length===1?"evento":"eventos"} · ${notas} ${notas===1?"nota":"notas"} del técnico${fotos?" · "+fotos+" "+(fotos===1?"imagen":"imágenes"):""}</p></div>
    </dl>

    <div class="body">
      <div class="col">
        <section class="sec rv" style="--i:9"><h2><span class="n">01</span>Datos de la incidencia</h2>
          <dl class="data" id="rData"></dl>
        </section>
        <section class="sec rv" style="--i:10"><h2><span class="n">02</span>Resumen IA</h2>
          <div class="ai"><h3>🧠 Resumen IA · Workers AI</h3><p id="rAi"><span class="shim" style="width:92%"></span><span class="shim" style="width:76%"></span></p><div class="meta" id="rAiMeta">Generando a partir del historial…</div></div>
        </section>
        <section class="sec rv" style="--i:11"><h2><span class="n">03</span>Línea de tiempo</h2>
          <div class="span">
            <div class="span-h"><span>Apertura <b>${esc(fecha(inicio))}</b></span><span>${fin?"Cierre <b>"+esc(fecha(fin))+"</b>":"<b>En curso</b>"}</span></div>
            <div class="track"><div class="fill${dur&&dur.viva?" live":""}" id="rFill"></div>${marks}</div>
            <div class="span-f"><span>0</span><span id="rSpanTot"></span></div>
          </div>
          ${ev.length||!cerrada?`<ol class="tl">${hitos}</ol>`:`<p class="et">Sin actividad registrada.</p>`}
        </section>
      </div>
      <aside class="col">
        <section class="sec rv" style="--i:12"><h2><span class="n">04</span>Resolución</h2>
          <div class="res${cerrada?"":" live"}">
            <div class="big"><span class="tick" aria-hidden="true">${cerrada?(cancel?"×":"✓"):"…"}</span><span id="rResT"></span></div>
            <p id="rResP"></p>
            <div class="by" id="rResBy"></div>
          </div>
        </section>
        <section class="sec rv" style="--i:13"><h2><span class="n">05</span>Responsable</h2>
          <div class="person"><div class="av" id="rAv"></div><div><b id="rWho"></b><span id="rWhoSub"></span></div></div>
        </section>
        <section class="sec rv" style="--i:14"><h2><span class="n">06</span>Fechas clave</h2>
          <ul class="facts" id="rFacts"></ul>
        </section>
        <section class="sec rv" style="--i:15">
          <div class="sign" id="rSign"></div>
        </section>
      </aside>
    </div>
    <footer class="foot"><span><b>yokup<span>●</span></b> · Soporte AdmiraNeXT · ticket persistido en D1 · IA Workers AI</span><span id="rFootUrl"></span></footer>
  </article>`;

  // ---- datos con textContent ----
  const set=(i,v)=>{ const n=$(i); if(n) n.textContent=v; };
  set("rNum",num);
  set("rEyebrow","INCIDENCIA · "+t.id+" · "+estado.toUpperCase());
  set("rTitle",t.subject||"(sin asunto)");
  $("rSub").replaceChildren(...[establecimiento||proyecto, establecimiento&&proyecto?" · "+proyecto:""].filter(Boolean).map((s,i)=>{ const n=document.createElement(i?"span":"b"); n.textContent=s; return n; }));
  set("rProj","📁 "+proyecto);
  set("rSev","Gravedad · "+sevLabel);
  set("rDurChip","⏱ "+(D?D.etiqueta(t):"—"));
  set("rStamp",estado);
  set("rStampSub",fin?fecha(fin).slice(0,10):(dur?"hace "+D.formato(dur.ms):""));
  set("kDurSub",dur?(dur.viva?"desde "+fecha(dur.inicio):fecha(dur.inicio).slice(11)+" → "+fecha(dur.fin).slice(11)+" · "+fecha(dur.fin).slice(0,10)):"Sin fecha de creación");
  set("kFirst",primera!=null&&D?D.formato(primera):"—");
  set("rSpanTot",dur&&D?D.formato(dur.ms):"");
  set("rFootUrl",informeUrl().replace(/^https?:\/\//,""));

  const dl=$("rData");
  const dato=(label,valor,sub,cls)=>{ const box=document.createElement("div"); box.className="datum"+(cls?" "+cls:""); const dt=document.createElement("dt"); dt.textContent=label; const dd=document.createElement("dd"); dd.textContent=valor; box.append(dt,dd); if(sub){ const s=document.createElement("dd"); s.className="sub"; s.textContent=sub; box.appendChild(s); } dl.appendChild(box); return dd; };
  dato("Proyecto · establecimiento",proyecto,establecimiento,"wide");
  dato("Origen",t.source==="agent-iot"?"🤖 Agente IoT":"👤 Manual",t.source&&t.source!=="agent-iot"?t.source:"");
  dato("Gravedad",sevLabel,t.priority?"prioridad "+t.priority:"");
  const eq=dato("Equipo",t.screen||"Sin equipo","","wide"); if(t.screen) eq.classList.add("mono");
  dato("Estado",estado,t.portal&&t.portal.incident_id?(t.portal.url?"Portal del comercio · ":"Yokup Desk · ")+(t.portal.site_name||t.portal.incident_id):"");
  dato("Duración",dur&&D?D.formato(dur.ms):"—",dur?(dur.viva?"sigue abierta":"de la creación al cierre"):"");

  // resolución
  if(cerrada){
    set("rResT",cancel?"Incidencia eliminada":"Incidencia resuelta");
    set("rResP",finEv?textoEvento(finEv):(cancel?"Cerrada sin intervención.":"Finalizada en Yokup."));
    set("rResBy",(finEv&&finEv.author?"Por "+finEv.author+" · ":"")+(fin?fecha(fin):"")+(dur?" · tras "+D.formato(dur.ms):""));
  } else {
    set("rResT","Pendiente de resolución");
    set("rResP","La incidencia sigue abierta: el informe refleja el estado a "+fecha(Date.now())+".");
    set("rResBy",dur?"Abierta hace "+D.formato(dur.ms):"");
  }
  // responsable
  set("rAv",iniciales(t.assignee));
  set("rWho",t.assignee||"Sin asignar");
  set("rWhoSub",[t.agent_runtime,t.agent_host==="cli"?"CLI":t.agent_host==="app"?"Desktop App":"","Responsable de la incidencia"].filter(Boolean).join(" · "));
  // fechas
  const facts=$("rFacts");
  [["Creada",fecha(t.created_at)],["Atendida",t.started_at?fecha(t.started_at):"—"],[cancel?"Eliminada":"Finalizada",fin?fecha(fin):"—"],["Última actualización",fecha(t.updated_at)],["Duración",dur&&D?D.formato(dur.ms):"—"]]
    .forEach(([k,v])=>{ const li=document.createElement("li"); const a=document.createElement("span"); a.textContent=k; const b=document.createElement("b"); b.textContent=v; li.append(a,b); facts.appendChild(li); });
  // firma
  const who=(window.YkAccess&&YkAccess.get&&YkAccess.get())||null;
  const sg=$("rSign");
  sg.textContent="";
  const l1=document.createElement("div"); l1.append("Informe "); const bn=document.createElement("b"); bn.textContent=num; l1.appendChild(bn);
  const l2=document.createElement("div"); l2.textContent="Generado el "+fecha(Date.now())+(who&&(who.name||who.email)?" por "+(who.name||who.email):"")+" desde Yokup.";
  const l3=document.createElement("div"); l3.textContent="Datos de la ficha "+t.id+" en el momento de generarlo.";
  sg.append(l1,l2,l3);

  // ---- revelado ----
  requestAnimationFrame(()=>{
    document.body.classList.add("ready");
    const fill=$("rFill");
    setTimeout(()=>{
      if(fill) fill.style.width="100%";
      document.querySelectorAll(".track .mk").forEach((m,i)=>setTimeout(()=>m.classList.add("on"),350+i*120));
      const ring=$("kRing"); if(ring) ring.style.strokeDashoffset=(C*(1-pct)).toFixed(2);
    },500);
    if(dur&&D) kpiCountUp($("kDur"),dur.ms,v=>D.formato(v),1500);
    kpiCountUp($("kEv"),ev.length,v=>String(Math.round(v)),1100);
    if(dur&&dur.viva&&D) setInterval(()=>{ const d=D.duracion(T); if(d){ set("kDur",D.formato(d.ms)); set("rDurChip","⏱ "+D.etiqueta(T)); } },1000);
  });
}

// Resumen IA: el mismo POST /ai-summary del botón de la ficha. Si la ficha ya lo
// generó en los últimos 30 min, se reutiliza (localStorage) en vez de pedir otro.
async function resumen(){
  let text="", origen="generado ahora a partir del historial";
  try{ const c=JSON.parse(localStorage.getItem("ykInformeResumen:"+id)||"null"); if(c&&c.text&&Date.now()-c.ts<1800000){ text=c.text; origen="el mismo Resumen IA generado en la ficha"; } }catch(e){}
  if(!text){
    try{ const r=await fetch(WORKER+"/ai-summary",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id})}); const d=await r.json(); text=String(d.text||"").trim(); }catch(e){}
    if(text) try{ localStorage.setItem("ykInformeResumen:"+id,JSON.stringify({text,ts:Date.now()})); }catch(e){}
  }
  SUMMARY=text; $("rpMail").href=mailto();
  const p=$("rAi"), meta=$("rAiMeta"); if(!p) return;
  if(!text){ p.textContent="Resumen IA no disponible ahora. El resto del informe refleja la ficha completa."; meta.textContent=""; return; }
  meta.textContent="Workers AI · "+origen+".";
  if(PRINT||document.body.classList.contains("rp-static")||matchMedia("(prefers-reduced-motion: reduce)").matches){ p.textContent=text; return; }
  // efecto máquina de escribir
  p.textContent=""; const span=document.createElement("span"); const caret=document.createElement("span"); caret.className="caret"; p.append(span,caret);
  let i=0; const step=()=>{ i=Math.min(text.length,i+Math.max(1,Math.round(text.length/90))); span.textContent=text.slice(0,i); if(i<text.length) setTimeout(step,18); else setTimeout(()=>caret.remove(),1200); };
  step();
}

async function main(){
  wireToolbar();
  if(!id){ $("rp").innerHTML='<div class="err">Falta el id de la incidencia: /informe-incidencia?id=INC-…</div>'; return; }
  let d;
  try{ const r=await fetch(WORKER+"/ticket?id="+encodeURIComponent(id),{cache:"no-store"}); d=await r.json(); }
  catch(e){ $("rp").innerHTML='<div class="err">No se pudo cargar la incidencia.</div>'; return; }
  if(!d||d.error||!d.ticket){ $("rp").innerHTML='<div class="err">Incidencia no encontrada.</div>'; return; }
  T=d.ticket; EV=(d.events||[]).filter(e=>e&&e.kind!=="race_bonus");
  if(PRINT) document.body.classList.add("rp-static");
  render();
  $("rpMail").href=mailto();
  const sum=resumen();
  if(PRINT){ await Promise.race([sum,new Promise(r=>setTimeout(r,6000))]); setTimeout(()=>window.print(),400); }
}
main();
})();
