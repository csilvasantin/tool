  /* ── CONTROL DE CLIs · misión #1278 ──────────────────────────────────────
     El worker yokup-rtc publica el censo en GET /fleet/cli (abierto) con TRES
     estados que no se pueden mezclar:
       · «vivo»         → su ordenador late y confirma que el proceso corre.
       · «parado»       → su ordenador late y confirma que NO corre. Es un HECHO.
       · «sin noticias» → nadie late en ese ordenador. Es IGNORANCIA: el CLI
                          podría estar corriendo sin que nos enteremos (le pasa a
                          toda máquina del grupo sin ejecutor instalado).
     Pintar los dos últimos igual llevaría a «arrancar» algo que ya está en
     marcha, así que cada uno lleva color, icono, rótulo y title distintos, y el
     arranque a ciegas pide confirmación explícita.
     Las órdenes van a POST /fleet/cli, que exige sesión del perímetro (acceso.js
     firma el fetch con el Bearer). El worker responde 202 «queued»: NO ejecuta
     al momento, sólo apunta la orden para que el ejecutor de la máquina destino
     la recoja en su próximo ciclo. Por eso el estado no cambia al pulsar y la
     interfaz lo dice y vigila el censo hasta que cambie de verdad. ── */
  var CLI_CICLO_SEG = 20;          // cada cuánto pasa el ejecutor de la máquina
  var CLI_REFRESCO_MS = 20000;     // refresco de fondo del censo
  var CLI_VIGILA_MS = 8000;        // sondeo tras mandar una orden
  var CLI_VIGILA_MAX_MS = 60000;   // hasta cuándo se vigila antes de rendirse
  var CLI_ITEMS = [], CLI_PENDIENTES = {}, cliRefresco = null;
  // Qué ordenadores están desplegados. No se persiste: cada visita al Highscore
  // empieza compacta, igual que los equipos del seguimiento de agentes.
  var CLI_ABIERTOS = new Set();
  // Qué CLI tiene el cuadro de misión abierto (uno cada vez: es una acción, no un
  // formulario que se deje puesto). Guarda `machine|cli`.
  var CLI_COMPONIENDO = null;

  function hsCliKey(item) {
    return normaliza(item && item.machine) + "|" + normaliza(item && item.cli);
  }

  /* Una SESIÓN de terminal se activa y se desactiva; un CLI se arranca y se mata.
     Usar los mismos verbos para las dos cosas era lo que hacía ilegible el panel
     (Carlos, 2026-08-08): «matar» una sesión vacía no significa nada. El worker
     manda el `kind` en cada item del censo; si falta, se lee como CLI, que es lo
     que era todo antes de FLT-1322. */
  function hsCliVerbos(item) {
    if (normaliza(item && item.kind).toLowerCase() === "session") return {
      cosa:"la sesión", arranca:"▶ Activar", mata:"■ Desactivar", ciega:"▶ A ciegas",
      vivo:"Activa", parado:"Inactiva", corre:"está abierta", noCorre:"NO está abierta",
      ariaMata:"Desactivar ", ariaArranca:"Activar "
    };
    return {
      cosa:"el CLI", arranca:"▶ Arrancar", mata:"■ Matar", ciega:"▶ A ciegas",
      vivo:"Vivo", parado:"Parado", corre:"está corriendo", noCorre:"NO está corriendo",
      ariaMata:"Matar ", ariaArranca:"Arrancar "
    };
  }

  function hsCliEstado(item) {
    var estado = normaliza(item && item.state).toLowerCase(), maquina = normaliza(item && item.machine) || "ese ordenador";
    var v = hsCliVerbos(item), Cosa = v.cosa.charAt(0).toUpperCase() + v.cosa.slice(1);
    if (estado === "vivo") return {
      clave:"vivo", tono:"viva", punto:"●", etiqueta:v.vivo,
      titulo:v.vivo + ": " + maquina + " late y confirma que " + v.cosa + " " + v.corre +
        (item && item.pid ? " (PID " + normaliza(item.pid) + ")" : "") + ".",
      accion:"stop", accionEtiqueta:v.mata, ciego:false
    };
    if (estado === "parado") return {
      clave:"parado", tono:"parada", punto:"○", etiqueta:v.parado,
      titulo:v.parado + ": " + maquina + " late y confirma que " + v.cosa + " " + v.noCorre + ". Es un hecho comprobado, no una suposición.",
      accion:"start", accionEtiqueta:v.arranca, ciego:false
    };
    return {
      clave:"sin noticias", tono:"muda", punto:"?", etiqueta:"Sin noticias",
      titulo:"Sin noticias: nadie late en " + maquina + ", así que NO sabemos si " + v.cosa + " corre. " +
        "No es lo mismo que estar parado: podría estar en marcha y no enterarnos." +
        " (" + Cosa + " sigue ahí; lo que falta es el ejecutor que lo cuente.)",
      accion:"start", accionEtiqueta:v.ciega, ciego:true
    };
  }

  function hsCliGrupos(items) {
    var orden = [], mapa = {};
    (items || []).forEach(function (item) {
      var maquina = normaliza(item && item.machine) || "Sin ordenador";
      if (!mapa[maquina]) { mapa[maquina] = { machine:maquina, items:[] }; orden.push(mapa[maquina]); }
      mapa[maquina].items.push(item);
    });
    orden.sort(function (a, b) { return a.machine.localeCompare(b.machine, "es"); });
    return orden;
  }

  function hsCliEstadoActual(clave) {
    var fila = (CLI_ITEMS || []).filter(function (item) { return hsCliKey(item) === clave; })[0];
    return fila ? hsCliEstado(fila).clave : "";
  }

  function hsCliAccionAria(item, estado) {
    var etiqueta = normaliza(item && item.label) || normaliza(item && item.cli), maquina = normaliza(item && item.machine);
    var v = hsCliVerbos(item);
    if (estado.accion === "stop") return v.ariaMata + etiqueta + " en " + maquina + ", que ahora está " + v.vivo.toLowerCase();
    if (estado.ciego) return v.ariaArranca + etiqueta + " en " + maquina + ", del que no hay noticias: nadie late allí y no se sabe si ya está corriendo";
    return v.ariaArranca + etiqueta + " en " + maquina + ", que ahora está " + v.parado.toLowerCase();
  }

  function hsCliEsperaTexto(espera, item) {
    var segundos = Math.max(0, Math.round((Date.now() - (espera && espera.desde || 0)) / 1000));
    var sesion = normaliza(item && item.kind).toLowerCase() === "session";
    var enviada = espera && espera.accion === "stop"
      ? (sesion ? "Orden de desactivar enviada" : "Orden de matar enviada")
      : (sesion ? "Orden de activar enviada" : "Orden de arranque enviada");
    return enviada + " · esperando a la máquina " + segundos + " s (ciclo de " + CLI_CICLO_SEG + " s)";
  }

  /* ENVIAR MISIÓN (Carlos, 2026-08-08): «al pulsar encima del Grok · CLI es como si
     escribiéramos en la sesión del terminal y se lo enviamos a Grok para que ejecute
     una misión si está despierto». El nombre del CLI se vuelve pulsable y abre un
     cuadro para escribir; lo que se escribe se teclea en su sesión.
     DOS condiciones, y las dos se explican en el sitio en vez de esconder el botón:
       · Sólo a un CLI, nunca a la SESIÓN de terminal: al otro lado de una sesión
         pelada hay una shell, y una frase escrita en una shell es un comando.
       · Sólo si está VIVO. Si no hay nadie leyendo, el texto se queda en el aire. */
  function hsCliEnviable(item) {
    return normaliza(item && item.kind).toLowerCase() !== "session";
  }
  function hsCliMotivoNoEnviable(item, estado) {
    if (!hsCliEnviable(item)) return "A una sesión de terminal no se le manda una misión: al otro lado hay una shell, no un agente.";
    if (estado.clave !== "vivo") return "Para mandarle una misión tiene que estar despierto. Arráncalo primero.";
    return "";
  }
  function hsCliComponerHTML(item) {
    var etiqueta = normaliza(item && item.label) || normaliza(item && item.cli);
    return '<form class="cli-ctl-mision" data-cli-mision-form="' + esc(hsCliKey(item)) + '">' +
      '<label class="sr-only" for="cliMisionTexto">Misión para ' + esc(etiqueta) + '</label>' +
      '<textarea id="cliMisionTexto" class="cli-ctl-mision-tx" rows="3" maxlength="600" required ' +
      'placeholder="Qué quieres que haga ' + esc(etiqueta) + '…"></textarea>' +
      '<div class="cli-ctl-mision-pie">' +
      '<button class="cli-ctl-act" type="submit">✉ Enviar</button>' +
      '<button class="cli-ctl-act cancelar" type="button" data-cli-mision-cancel="1">Cancelar</button>' +
      '</div></form>';
  }

  function hsCliFila(item) {
    var estado = hsCliEstado(item), espera = CLI_PENDIENTES[hsCliKey(item)];
    var etiqueta = normaliza(item && item.label) || normaliza(item && item.cli) || "CLI sin nombre";
    var motivo = hsCliMotivoNoEnviable(item, estado), componiendo = CLI_COMPONIENDO === hsCliKey(item);
    var nombre = motivo
      ? '<span class="cli-ctl-label" title="' + esc(etiqueta + " — " + motivo) + '">' + esc(etiqueta) + '</span>'
      : '<button class="cli-ctl-label enviable" type="button" data-cli-mision="' + esc(hsCliKey(item)) + '"' +
        ' title="' + esc("Escribirle una misión a " + etiqueta + ": se teclea en su sesión, como si estuvieras delante.") + '"' +
        ' aria-expanded="' + componiendo + '">' + esc(etiqueta) + '<span class="cli-ctl-pluma" aria-hidden="true">✎</span></button>';
    return '<div class="cli-ctl-row' + (componiendo ? " componiendo" : "") + '">' +
      '<span class="cli-ctl-name">' + nombre +
      '<span class="cli-ctl-state ' + estado.tono + '" title="' + esc(estado.titulo) + '">' +
      '<span class="cli-ctl-dot" aria-hidden="true">' + estado.punto + '</span>' + esc(estado.etiqueta) + '</span></span>' +

      (espera ? " disabled" : "") +
      ' data-cli-accion="' + estado.accion + '" data-cli-machine="' + esc(normaliza(item && item.machine)) + '"' +
      ' data-cli-nombre="' + esc(normaliza(item && item.cli)) + '" data-cli-ciego="' + (estado.ciego ? "1" : "0") + '"' +
      ' title="' + esc(estado.titulo) + '" aria-label="' + esc(hsCliAccionAria(item, estado)) + '">' +

  function hsRenderCliControl() {
    var list = document.getElementById("cliCtlList"), count = document.getElementById("cliCtlCount");
    if (!list || !count) return;
    var grupos = hsCliGrupos(CLI_ITEMS);
    var vivos = (CLI_ITEMS || []).filter(function (item) { return hsCliEstado(item).clave === "vivo"; }).length;
    count.textContent = CLI_ITEMS.length ? vivos + "/" + CLI_ITEMS.length + " vivos" : "—";
    if (!grupos.length) { list.innerHTML = '<div class="cli-ctl-empty">No hay CLIs declarados.</div>'; return; }

  function hsCliMensaje(texto, error) {

  function hsCargaCliControl() {

      if (!r.ok) throw new Error("/fleet/cli → " + r.status);

  // Tras encolar una orden el estado tarda: se sondea el censo cada 8 s durante
  // un minuto y se cuenta lo que pasa de verdad, sin fingir que ya cambió.
  function hsCliVigila(clave) {
    var limite = Date.now() + CLI_VIGILA_MAX_MS;
    function tic() {
      hsCargaCliControl().then(function () {
        var espera = CLI_PENDIENTES[clave];
        if (!espera) return;
        var ahora = hsCliEstadoActual(clave);
        if (ahora && ahora !== espera.previo) {
          delete CLI_PENDIENTES[clave]; hsRenderCliControl();
          hsCliMensaje("Hecho: " + clave.split("|")[1] + " figura ya como «" + ahora + "» en " + clave.split("|")[0] + ".", false);
          return;
        }
        if (Date.now() >= limite) {
          delete CLI_PENDIENTES[clave]; hsRenderCliControl();
          hsCliMensaje("La orden sigue encolada tras " + Math.round(CLI_VIGILA_MAX_MS / 1000) +
            " s: la máquina aún no la ha recogido. No se ha perdido, y el estado se sigue refrescando solo.", true);
          return;
        }
        setTimeout(tic, CLI_VIGILA_MS);
      });
    }
    setTimeout(tic, CLI_VIGILA_MS);
  }

  function hsCliOrdena(machine, cli, accion, ciego) {
    var clave = normaliza(machine) + "|" + normaliza(cli);
    if (CLI_PENDIENTES[clave]) return;
    if (ciego && !confirm("Nadie late en " + machine + ", así que no sabemos si " + cli + " ya está corriendo.\n\n" +
      "La orden se encolará igualmente y sólo se cumplirá cuando esa máquina tenga ejecutor. ¿Seguir?")) return;
    CLI_PENDIENTES[clave] = { accion:accion, desde:Date.now(), previo:hsCliEstadoActual(clave) };
    hsRenderCliControl();
    hsCliMensaje("Orden enviada, esperando a " + machine + "…", false);
    fetch(YK + "/fleet/cli", {
      method:"POST", cache:"no-store",
      headers:{ "content-type":"application/json" },
      body:JSON.stringify({ machine:machine, cli:cli, action:accion })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { status:r.status, ok:r.ok, body:d || {} }; });
    }).then(function (res) {
      if (res.status === 401) throw new Error("Necesitas iniciar sesión: tu sesión ha caducado. Vuelve a entrar y repite la orden.");
      if (res.status === 403) throw new Error("Ese CLI no está en la lista blanca del worker: la orden no se ha encolado.");
      if (!res.ok || res.body.ok === false) throw new Error(normaliza(res.body.error) || ("El worker respondió " + res.status));
      hsCliMensaje("Orden encolada (" + (normaliza(res.body.status) || "queued") + "). " + machine +
        " la recoge en su próximo ciclo, cada " + CLI_CICLO_SEG + " s; el estado se refresca solo hasta que cambie.", false);
      hsCliVigila(clave);
    }).catch(function (e) {
      delete CLI_PENDIENTES[clave];
      hsRenderCliControl();
      hsCliMensaje(normaliza(e && e.message) || "No se pudo enviar la orden", true);
    });
  }

  // Mandar la misión. No se vigila el censo después: una misión no cambia el
  // estado del CLI —sigue vivo, ahora con trabajo—, así que fingir una espera de
  // "a ver si cambia algo" seria mentir sobre lo que se puede comprobar.
  function hsCliEnviaMision(machine, cli, texto) {
    var limpio = normaliza(texto).replace(/\s+/g, " ").trim();
    if (!limpio) { hsCliMensaje("Escribe la misión antes de enviarla.", true); return; }
    if (limpio.length > 600) { hsCliMensaje("La misión no puede pasar de 600 caracteres (llevas " + limpio.length + ").", true); return; }
    hsCliMensaje("Enviando la misión a " + machine + "…", false);
    fetch(YK + "/fleet/cli", {
      method:"POST", cache:"no-store",
      headers:{ "content-type":"application/json" },
      body:JSON.stringify({ machine:machine, cli:cli, action:"mission", text:limpio })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { status:r.status, ok:r.ok, body:d || {} }; });
    }).then(function (res) {
      if (res.status === 401) throw new Error("Necesitas iniciar sesión: tu sesión ha caducado. Vuelve a entrar y repite la misión.");
      if (res.status === 403) throw new Error("Ese CLI no está en la lista blanca del worker: la misión no se ha encolado.");
      if (!res.ok || res.body.ok === false) throw new Error(normaliza(res.body.error) || ("El worker respondió " + res.status));
      CLI_COMPONIENDO = null;
      hsRenderCliControl();
      hsCliMensaje("Misión encolada para " + cli + " en " + machine + ". Se le escribirá en su sesión en el próximo ciclo, cada " +
        CLI_CICLO_SEG + " s. Si se ha dormido entre medias, la orden se rechaza y se dice.", false);
    }).catch(function (e) {
      hsCliMensaje(normaliza(e && e.message) || "No se pudo enviar la misión", true);
    });
  }

  /* CENTRO OPERATIVO v2. La fuente es el snapshot de procesos de cada Mac, no
     el catálogo histórico de CLIs. Una ranura anunciada y sin proceso está
     PARADA; una máquina sin watcher queda DESCONOCIDA y no recibe botones. */
  function hsOpsKey(item) {
    return [item.machine,item.persona,item.runtime,item.host,item.session_id].map(claveHoraria).join("|");
  }
  function hsOpsAge(epoch) {
    var seconds = Math.max(0, Math.round(Date.now()/1000-Number(epoch||0)));
    return seconds < 60 ? "hace "+seconds+" s" : "hace "+Math.floor(seconds/60)+" min";
  }
  function hsOpsItems() {
    var machines = {}, now = Date.now()/1000;
    (datos.controlMachines||[]).forEach(function (machine) {
      var key=claveHoraria(machine.machine); if(!key)return;
      machines[key]={machine:machine.machine,watcher:true,updated:Number(machine.updated||0),slots:machine.slots||[],items:{}};
    });
    (datos.presencia||[]).forEach(function (row) {
      if (!(row&&row.verified&&row.source==="process_snapshot"&&Number(row.updated||0)>=now-35)) return;
      var machineKey=claveHoraria(row.machine); if(!machineKey)return;
      var group=machines[machineKey]||(machines[machineKey]={machine:row.machine,watcher:false,updated:Number(row.updated||0),slots:[],items:{}});
      var item={machine:row.machine,persona:row.persona,runtime:row.runtime,host:row.host,session_id:row.session_id,
        pid:Number(row.pid||0),active:true,attached:row.attached===true,model:row.model||"",project:row.project||"",
        task:row.task||"",focus:row.focus||"",updated:Number(row.updated||0),declared_updated:Number(row.declared_updated||0),verified:true,watcher:group.watcher};
      group.items[hsOpsKey(item)]=item;
    });
    Object.keys(machines).forEach(function (key) {
      var group=machines[key];
      (group.slots||[]).forEach(function (slot) {
        var item={machine:group.machine,persona:slot.persona,runtime:slot.runtime,host:slot.host,session_id:slot.session_id,
          pid:0,active:false,attached:false,model:"",project:"",task:"",focus:"",updated:group.updated,declared_updated:0,verified:true,watcher:true};
        var itemKey=hsOpsKey(item); if(!group.items[itemKey])group.items[itemKey]=item;
        else group.items[itemKey].watcher=true;
      });
    });
    return Object.keys(machines).map(function(key){var group=machines[key];return {machine:group.machine,watcher:group.watcher,
      updated:group.updated,items:Object.keys(group.items).map(function(itemKey){return group.items[itemKey];})};})
      .sort(function(a,b){return a.machine.localeCompare(b.machine,"es");});
  }
  function hsOpsFind(key) {
    var found=null; hsOpsItems().some(function(group){return group.items.some(function(item){if(hsOpsKey(item)===key){found=item;return true;}return false;});});
    return found;
  }
  function hsOpsRow(item) {
    var key=hsOpsKey(item),pending=CLI_PENDIENTES[key],surface=item.host==="app"?"DesktopAPP":"CLI";
    var doing=item.task||item.focus||"Sin actividad declarada", project=item.project||"Sin proyecto declarado";
    var declarationAge=item.declared_updated?" · actividad declarada "+hsOpsAge(item.declared_updated):"";
    var state=item.active?"Activo":"Parado", tone=item.active?"viva":"parada";
    var action=item.active?"stop":"start", label=item.active?"■ Detener":"▶ Arrancar";
    var disabled=pending||(!item.active&&!item.watcher)||(!item.active?false:!(item.verified&&item.pid>1));
    return '<div class="cli-ctl-row">'+
      '<span class="cli-ctl-name"><b class="cli-ctl-label">'+esc(item.persona+' · '+item.runtime)+'</b>'+
      '<span class="cli-ctl-surface '+(item.host==="app"?'app':'cli')+'">'+surface+'</span>'+
      '<span class="cli-ctl-state '+tone+'"><span class="cli-ctl-dot" aria-hidden="true">'+(item.active?'●':'○')+'</span>'+state+'</span></span>'+
      '<button class="cli-ctl-act '+action+'" type="button" data-op-key="'+esc(key)+'" data-op-action="'+action+'"'+
      (disabled?' disabled':'')+' aria-label="'+esc(label+' '+item.persona+' '+surface+' en '+item.machine)+'">'+esc(label)+'</button>'+
      '<p class="cli-ctl-meta"><b>'+esc(project)+'</b> · '+esc(doing)+esc(declarationAge)+'<br>'+esc(item.active?('PID '+item.pid+' · '+(item.model||'modelo no declarado')+' · '+(item.host==='cli'?(item.attached?'terminal atendido':'autónomo / detached'):'aplicación de escritorio')):'ranura lista para arrancar')+' · censo '+hsOpsAge(item.updated)+'</p>'+
      (pending?'<p class="cli-ctl-wait">Orden '+esc(pending.action==='start'?'de arranque':'de parada')+' enviada · esperando confirmación del proceso…</p>':'')+'</div>';
  }
  function hsRenderCliControl() {
    var list=document.getElementById("cliCtlList"),count=document.getElementById("cliCtlCount"); if(!list||!count)return;
    var groups=hsOpsItems(),items=[].concat.apply([],groups.map(function(group){return group.items;}));
    var active=items.filter(function(item){return item.active;}).length;
    count.textContent=active+' activos · '+groups.length+' eq';
    if(!groups.length){list.innerHTML='<div class="cli-ctl-empty">No hay ningún watcher de procesos reciente. El estado es desconocido; no se inventa.</div>';return;}
    list.innerHTML=groups.map(function(group,index){
      var open=CLI_ABIERTOS.has(group.machine),activeGroup=group.items.filter(function(item){return item.active;}).length,id='cliCtlMaquina'+index;
      return '<fieldset class="cli-ctl-group"><legend class="sr-only">Superficies de '+esc(group.machine)+'</legend><button class="cli-ctl-machine" type="button" data-cli-maquina="'+esc(group.machine)+'" aria-controls="'+id+'" aria-expanded="'+open+'"><span class="cli-ctl-chevron" aria-hidden="true"></span><span class="cli-ctl-label">'+esc(group.machine)+'</span><span class="cli-ctl-tally'+(activeGroup?' viva':'')+'">'+activeGroup+'/'+group.items.length+'</span></button><div class="cli-ctl-clis" id="'+id+'"'+(open?'':' hidden')+'>'+group.items.sort(function(a,b){return Number(b.active)-Number(a.active)||a.persona.localeCompare(b.persona,"es");}).map(hsOpsRow).join('')+'</div></fieldset>';
    }).join('');
    list.querySelectorAll('[data-cli-maquina]').forEach(function(button){button.addEventListener('click',function(){var machine=button.getAttribute('data-cli-maquina');if(CLI_ABIERTOS.has(machine))CLI_ABIERTOS.delete(machine);else CLI_ABIERTOS.add(machine);hsRenderCliControl();});});
    list.querySelectorAll('[data-op-action]').forEach(function(button){button.addEventListener('click',function(){hsOpsOrder(button.getAttribute('data-op-key'),button.getAttribute('data-op-action'));});});
  }
  function hsCargaCliControl() {
    return fetch(TG+'/api/presence',{cache:'no-store'}).then(function(response){if(!response.ok)throw new Error('/api/presence → '+response.status);return response.json();}).then(function(payload){
      datos.presencia=payload.presence||[];datos.controlMachines=payload.control_machines||[];CLI_ITEMS=hsOpsItems();hsRenderCliControl();return payload;
    }).catch(function(error){hsCliMensaje('No se pudo verificar la flota: '+normaliza(error&&error.message),true);throw error;});
  }
  function hsOpsWatch(key,wanted,deadline) {
    setTimeout(function(){hsCargaCliControl().then(function(){var item=hsOpsFind(key),done=item&&item.active===wanted;
      if(done){delete CLI_PENDIENTES[key];hsRenderCliControl();hsCliMensaje('✓ Confirmado por el proceso: '+item.persona+' · '+(item.host==='app'?'DesktopAPP':'CLI')+' está '+(wanted?'activo':'parado')+' en '+item.machine+'.',false);return;}
      if(Date.now()>=deadline){delete CLI_PENDIENTES[key];hsRenderCliControl();hsCliMensaje('La orden fue aceptada, pero el proceso no confirmó el estado antes de 45 s. Se conserva como pendiente, no como hecha.',true);return;}
      hsOpsWatch(key,wanted,deadline);
    }).catch(function(){if(Date.now()<deadline)hsOpsWatch(key,wanted,deadline);});},2000);
  }
  function hsOpsOrder(key,action) {
    if(CLI_PENDIENTES[key])return;var item=hsOpsFind(key);if(!item){hsCliMensaje('La ranura ya no existe en el último censo.',true);return;}
    var surface=item.host==='app'?'DesktopAPP':'CLI';
    if(action==='stop'&&!confirm('Detener '+item.persona+' · '+surface+' en '+item.machine+' (PID '+item.pid+')?'))return;
    CLI_PENDIENTES[key]={action:action,desde:Date.now()};hsRenderCliControl();hsCliMensaje((action==='start'?'Arrancando ':'Deteniendo ')+item.persona+' · '+surface+' en '+item.machine+'…',false);
    var body={action:action,machine:item.machine,persona:item.persona,runtime:item.runtime,host:item.host,session_id:item.session_id};if(action==='stop')body.pid=item.pid;
    fetch(YK+'/fleet/agent/control',{method:'POST',cache:'no-store',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(response){return response.json().catch(function(){return {};}).then(function(payload){return {ok:response.ok,status:response.status,payload:payload};});}).then(function(result){
      if(result.status===401)throw new Error('Necesitas iniciar sesión de nuevo.');if(!result.ok)throw new Error(normaliza(result.payload.error)||('Control → '+result.status));
      if(result.payload.status==='already_running'){delete CLI_PENDIENTES[key];hsCargaCliControl();hsCliMensaje('Ya estaba activo; no se duplicó el proceso.',false);return;}
      hsCliMensaje('Orden '+normaliza(result.payload.status||'queued')+' · esperando la confirmación del watcher de '+item.machine+'.',false);hsOpsWatch(key,action==='start',Date.now()+45000);
    }).catch(function(error){delete CLI_PENDIENTES[key];hsRenderCliControl();hsCliMensaje(normaliza(error&&error.message)||'No se pudo gobernar la superficie',true);});
  }

  function iniciaCliControl() {
    if (!document.getElementById("cliCtlList")) return;
    var cabecera = document.getElementById("cliCtlToggle"), cuerpo = document.getElementById("cliCtlBody");
    if (cabecera && cuerpo) {

        cabecera.setAttribute("aria-expanded", String(abrir));
        cuerpo.hidden = !abrir;
      });

    hsCargaCliControl();

    cliRefresco = setInterval(function () { hsCargaCliControl(); }, CLI_REFRESCO_MS);

  iniciaColumnasReajustables();
  iniciaOrdenTabla();

  function claveAgenteCarrera(agente) {
    return normaliza(agente).toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function trabajosEnCurso() {
    var seen = Object.create(null), priority = { objective:1, mission:2, task:3 };
    (datos.trabajos || []).forEach(function (item) {
      if (!item || !normaliza(item.agent) || !normaliza(item.executor)) return;
      var key = normaliza(item.family_key) || claveAgenteCarrera(item.agent), previous = seen[key];
      if (!previous || priority[item.kind] > priority[previous.kind] ||
          (priority[item.kind] === priority[previous.kind] && Number(item.active_at) > Number(previous.active_at))) seen[key] = item;
    });
    return Object.keys(seen).map(function (key) {
      var item = seen[key];
      return { key:claveAgenteCarrera(item.agent), agente:item.agent, executor:item.executor,
        kind:item.kind, title:item.title || (item.kind === "task" ? "Tarea activa" : item.kind === "mission" ? "Misión activa" : "Objetivo en curso"),
        at:Number(item.work_progress_at || item.active_at) || 0, dedicatedMs:Number.isFinite(Number(item.dedicated_ms)) ? Number(item.dedicated_ms) : null,
        timingBasis:item.timing_basis || "", operationalBasis:item.operational_basis || "", presenceAt:Number(item.presence_at) || 0 };
    }).sort(function (a, b) { return b.at - a.at || a.agente.localeCompare(b.agente, "es"); });
  }

  // La regla vive en highscore-race.js, que es donde se puede probar de verdad:
  // un trabajo está EN CURSO si AVANZA hace poco, no si la máquina está encendida.
  function trabajoParado(at, ahora) {
    return typeof YkHighscoreRace !== "undefined" && YkHighscoreRace.workIdle
      ? YkHighscoreRace.workIdle(at, ahora) : !Number(at);
  }
  function desdeHace(at, ahora) {
    return typeof YkHighscoreRace !== "undefined" && YkHighscoreRace.sinceLabel
      ? YkHighscoreRace.sinceLabel(at, ahora) : "sin marca de avance";
  }

  function resumenTrabajoActivo(trabajo, ahora) {
    var parado = trabajoParado(trabajo.at, ahora);
    var duracion = typeof YkHighscoreRace !== "undefined" && YkHighscoreRace.durationLabel
      ? YkHighscoreRace.durationLabel(trabajo.dedicatedMs) : "—";
    return { reference:"", title:trabajo.title, state:parado ? "SIN AVANCE" : "EN CURSO", project:"",
      executor:trabajo.executor, responsible:trabajo.agente, kind:trabajo.kind, operationalBasis:trabajo.operationalBasis,
      presenceAt:trabajo.presenceAt, at:Number(trabajo.at) || 0, idle:parado, since:desdeHace(trabajo.at, ahora),
      duration:duracion, timingBasis:trabajo.timingBasis };
  }

  function actualizaCarreraPodio() {
    var contenedor = document.getElementById("refreshLanes");
    var trabajos = trabajosEnCurso(), completas = listaCompletaCache || [], byKey = Object.create(null);
    var ahora = Date.now();
    completas.forEach(function (fila) { byKey[claveAgenteCarrera(fila && fila.agente)] = fila; });
    var corredores = trabajos.map(function (trabajo, index) {
      var base = byKey[trabajo.key] || { agente:trabajo.agente, posicion:completas.length + index + 1,
        total:0, vivo:false, maquinas:[], maquinasVivas:[] };
      var fila = Object.assign({}, base, { vivo:!!base.vivo || trabajo.operationalBasis === "verified_process" });
      return { fila:fila, clave:trabajo.key, resumen:resumenTrabajoActivo(trabajo, ahora) };
    });
    corredores.sort(function (a, b) {
      return (Number(a.fila.posicion) || 9999) - (Number(b.fila.posicion) || 9999) ||
        a.resumen.title.localeCompare(b.resumen.title, "es");
    });
    var enlaces = corredores, filasElegibles = enlaces.map(function (enlace) { return enlace.fila; });
    var clavesActivas = enlaces.map(function (enlace) { return enlace.clave; });
    var filasCarrera = typeof YkHighscoreRace !== "undefined" && YkHighscoreRace.raceRows

      carril.classList.toggle("finished", progresoAtleta >= 1);
      carril.classList.toggle("race-winner", ordenLlegada === 1);
      carril.classList.toggle("race-loser", ordenLlegada !== 1);
      if (relleno) {
        var avancePista = Math.max(0, Math.min(metaLinea - inicioPista, centroAtleta - inicioPista));
        relleno.style.width = avancePista + "px";
      }
      if (mision) {
        // La ventana termina justo detrás del corredor y crece con él hasta la
        // meta. El título permanece centrado en todo el espacio ya conquistado.
        var espacioMision = Math.max(0, centroAtleta - RADIO_CORREDOR_PX - 2);
        var tituloMision = mision.querySelector(".refresh-mission-title");
        mision.style.left = posicionCorredor;
        mision.style.width = espacioMision + "px";
        if (tituloMision) {
          tituloMision.style.transform = "translateX(0)";
        }
      }
    });
    var quedan = Math.max(0, Math.ceil((1 - progreso) * REFRESCO_MS / 1000));
    document.getElementById("refreshCount").textContent = quedan + " S";
    document.getElementById("refreshRace").setAttribute("aria-label", "Próxima actualización de puntuación en " + quedan + " segundos. Pulsa para parar la carrera.");
  }
  function fijaFaseSalida(fase, llamada) {
    var carrera = document.getElementById("refreshRace");
    ["ready", "set", "go"].forEach(function (nombre) {
      carrera.classList.toggle("phase-" + nombre, nombre === fase);
    });
    var aviso = document.querySelector(".race-call");
    if (aviso) aviso.textContent = llamada || "";
  }
  function pintaMomentoCarrera(transcurrido) {
    transcurrido = Math.max(0, Math.min(CICLO_MS, transcurrido));
    if (transcurrido < SALIDA_MS) {
      var paso = Math.min(2, Math.floor(transcurrido / PASO_SALIDA_MS));
      var fases = ["ready", "set", "go"], llamadas = ["READY", "SET", "GO"];
      pintaCarrera(0);
      fijaFaseSalida(fases[paso], llamadas[paso]);
      document.getElementById("refreshCount").textContent = llamadas[paso];
      document.getElementById("refreshRace").setAttribute("aria-label", llamadas[paso] + " · salida en " + (3 - paso) + " segundos. Pulsa para parar la carrera.");
      return;
    }
    fijaFaseSalida("", "");
    if (transcurrido < SALIDA_MS + REFRESCO_MS) {
      pintaCarrera((transcurrido - SALIDA_MS) / REFRESCO_MS);
      return;
    }
    pintaCarrera(1);
    document.getElementById("refreshCount").textContent = "META";
    document.getElementById("refreshRace").setAttribute("aria-label", "Meta · celebrando el resultado. Pulsa para parar la carrera.");
  }
  function avanzaCarrera(ahora) {
    if (carreraPausada) return;
    var transcurrido = Math.min(CICLO_MS, ahora - carreraInicio);
    pintaMomentoCarrera(transcurrido);
    if (transcurrido < CICLO_MS) {
      carreraFrame = requestAnimationFrame(avanzaCarrera);
      return;
    }
    actualizaMarcador().then(iniciaCarrera);
  }
  function pintaControlCarrera() {
    var carrera = document.getElementById("refreshRace");
    carrera.setAttribute("aria-pressed", carreraPausada ? "true" : "false");
    carrera.title = carreraPausada ? "Reanudar carrera desde el punto de pausa" : "Pausar carrera para leer las misiones";
    if (carreraPausada) carrera.setAttribute("aria-label", "Carrera pausada. Pulsa para reanudarla.");
    carrera.classList.toggle("paused", carreraPausada);
  }
  function pintaControlPodio() {
    var boton = document.getElementById("podiumToggle"), podio = document.getElementById("podio");
    var visible = !podio.hidden;
    boton.setAttribute("aria-expanded", visible ? "true" : "false");
    boton.title = visible ? "Ocultar podio" : "Mostrar podio";
  }
  function alternaPodio() {
    var podio = document.getElementById("podio");
    podio.hidden = !podio.hidden;
    pintaControlPodio();
    if (!podio.hidden) dibujaPodio(brazosBajos);
  }
  function pausaOReiniciaCarrera() {
    if (!carreraPausada) {
      carreraTiempoPausado = Math.max(0, Math.min(CICLO_MS, performance.now() - carreraInicio));
      carreraPausada = true;
      cancelAnimationFrame(carreraFrame);
      pintaMomentoCarrera(carreraTiempoPausado);
      document.getElementById("refreshCount").textContent = "PAUSA";
      pintaControlCarrera();
      return;
    }
    carreraPausada = false;
    carreraInicio = performance.now() - carreraTiempoPausado;
    pintaControlCarrera();
    if (REDUCE_MOTION) {
      pintaMomentoCarrera(SALIDA_MS + REFRESCO_MS);
      return;
    }
    pintaMomentoCarrera(carreraTiempoPausado);
    carreraFrame = requestAnimationFrame(avanzaCarrera);
  }
  function iniciaCarrera() {
    cancelAnimationFrame(carreraFrame);
    carreraPausada = false;
    carreraTiempoPausado = 0;
    sorteaOrdenLlegada(true);
    pintaControlCarrera();
    carreraInicio = performance.now();
    // Estado final legible y sin bucle RAF para quien pidió reducir movimiento.
    if (REDUCE_MOTION) {
      pintaMomentoCarrera(SALIDA_MS + REFRESCO_MS);
      return;
    }
    pintaMomentoCarrera(0);
    carreraFrame = requestAnimationFrame(avanzaCarrera);
  }
  var pistaCarrera = document.getElementById("refreshRace");
  pistaCarrera.addEventListener("click", pausaOReiniciaCarrera);
  pistaCarrera.addEventListener("keydown", function (evento) {
    if (evento.key !== "Enter" && evento.key !== " " && evento.key !== "Spacebar") return;
    evento.preventDefault();
    pausaOReiniciaCarrera();
  });
  document.getElementById("podiumToggle").addEventListener("click", alternaPodio);
  pintaControlPodio();
})();
</script>
