<title>Highscore · Yokup</title>
<meta name="description" content="Marcador de la flota de agentes AdmiraNeXT: quién trabaja más, en cualquier momento.">

<style>
:root{--bg:#02080d;--card:#0a1620;--card2:#0d1c28;--ink:#dff8ff;--mut:#75aab9;--dim:#4d7a88;
  --brand:#78f3ff;--accent:#ffd866;--good:#88ffaa;--warn:#ff8866;--violet:#aa88ff;--mag:#ff6b9d;
  --line:rgba(120,243,255,.16);--line2:rgba(120,243,255,.30);
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,monospace;
  --oro:#ffd866;--plata:#cfe4ec;--bronce:#e09a5a}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--mono);min-height:100vh}
a{color:var(--brand)}

.wrap{position:relative;z-index:1}

/* ─────────── PANTALLA DE CARGA ─────────── */
/* PRESITE: la carátula 16:9 se ve completa incluso en resoluciones o relaciones
   de aspecto menores. La interfaz queda reducida a la carga y la entrada. */
#carga{position:fixed;inset:0;z-index:9999;
  background:#000 url("/img/highscore-presite-decathlon.png") center center/contain no-repeat;
  cursor:pointer;overflow:hidden;isolation:isolate}
#carga::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.04) 0 58%,rgba(0,0,0,.48) 100%)}
#carga.fuera{opacity:0;pointer-events:none;transition:opacity .5s}
.presite-ui{position:absolute;z-index:2;left:50%;bottom:clamp(28px,7vh,76px);transform:translateX(-50%);
  width:min(76vw,440px);text-align:center;filter:drop-shadow(0 3px 12px rgba(0,0,0,.9))}
.barra{width:100%;height:3px;background:rgba(223,248,255,.28);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--brand);box-shadow:0 0 12px var(--brand);transition:width .3s}
.pie{font-size:10.5px;color:#fff;letter-spacing:.16em;margin-top:12px;min-height:14px;text-shadow:0 2px 8px #000}
.pulsa{margin-top:15px;font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--good);
  text-shadow:0 2px 8px #000,0 0 14px rgba(136,255,170,.5);animation:parpa 1s ease-in-out infinite}
@keyframes parpa{50%{opacity:.15}}
@media (max-aspect-ratio:16/9){.presite-ui{bottom:calc((100vh - 56.25vw)/2 + clamp(18px,4vh,44px))}}

/* ─────────── PÁGINA ─────────── */
.wrap{max-width:1080px;margin:0 auto;padding:50px 18px 70px}
header.cab{position:relative;display:grid;grid-template-columns:auto minmax(180px,1fr);grid-template-rows:auto;
  align-items:stretch;column-gap:22px;min-height:44px;margin:0 0 8px}
/* El rótulo y el mute comparten la altura de toda la carrera: así quedan
   alineados con su carril central, no flotando sobre la primera pista. */
header.cab>h1{grid-column:1;grid-row:1;display:flex;align-items:center;align-self:center;gap:7px}
h1{font-size:clamp(20px,3.2vw,31px);font-weight:900;letter-spacing:.08em;margin:0;color:var(--brand);
  text-shadow:3px 3px 0 #0a4a58}
.podium-toggle{all:unset;display:inline-block;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;
  text-shadow:inherit;border-radius:5px;transition:color .16s,text-shadow .16s,transform .16s}
.podium-toggle:hover,.podium-toggle:focus-visible{color:var(--ink);text-shadow:3px 3px 0 #0a4a58,0 0 12px rgba(120,243,255,.5)}
.podium-toggle:focus-visible{outline:2px solid var(--brand);outline-offset:5px}
.podium-toggle[aria-expanded="true"]{color:var(--accent);transform:translateY(1px);
  text-shadow:3px 3px 0 #5a4310,0 0 12px rgba(255,216,102,.42)}

/* podio: la ilustración conserva siempre su proporción 16:9 y ocupa el mismo
   bloque que antes ocupaban los tres cajones generados con CSS. Los datos vivos
   quedan en placas pequeñas; el detalle completo sigue justo debajo, en la tabla. */
.podio{position:relative;width:100%;aspect-ratio:16/9;margin:12px 0 8px;overflow:hidden;
  isolation:isolate;background:#02080d;border:1px solid rgba(120,243,255,.12);
  box-shadow:0 18px 46px rgba(0,0,0,.34)}
.podio[hidden]{display:none}
.podio-arte{position:absolute;inset:0;z-index:0;pointer-events:none}
.podio-arte canvas{display:block;width:100%;height:100%}
.podio-velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,8,13,.03),transparent 58%,rgba(2,8,13,.22));z-index:1}
.plaza{position:absolute;z-index:3;width:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:7px 10px;background:rgba(2,8,13,.74);border:1px solid;border-radius:6px;
  box-shadow:0 5px 18px rgba(0,0,0,.38);backdrop-filter:blur(3px);color:inherit;text-decoration:none}
.plaza[href]{cursor:pointer;transition:transform .16s,background .16s,box-shadow .16s}
.plaza[href]:hover,.plaza[href]:focus-visible{transform:translateY(-2px);background:rgba(7,25,35,.92);
  box-shadow:0 7px 22px rgba(0,0,0,.5),0 0 0 2px var(--brand);outline:none}
.plaza.p2{left:10%;top:62%;border-color:rgba(207,228,236,.64)}
.plaza.p1{left:39%;top:59%;border-color:rgba(255,216,102,.72)}
.plaza.p3{right:9%;top:66%;border-color:rgba(224,154,90,.68)}
.plaza.podium-live::after{content:"";position:absolute;inset:-5px;border:2px solid rgba(136,255,170,.8);
  border-radius:9px;box-shadow:0 0 8px rgba(136,255,170,.7),inset 0 0 5px rgba(136,255,170,.2);
  pointer-events:none;animation:podium-heartbeat 1.6s ease-in-out infinite}
@keyframes podium-heartbeat{0%,100%{opacity:.92;transform:scale(1)}45%{opacity:.3;transform:scale(1.025)}60%{opacity:.78;transform:scale(1.008)}}
.podio .avatar,.podio .maq,.podio .maqs,.podio .bloque{display:none}
.nom{font-size:12px;font-weight:800;letter-spacing:.03em;text-align:center;word-break:break-word;padding:0}
.pts{display:inline-flex;align-items:center;gap:5px;font-size:18px;font-weight:900;margin:0;letter-spacing:.02em;white-space:nowrap}
.p1 .pts{color:var(--oro)} .p2 .pts{color:var(--plata)} .p3 .pts{color:var(--bronce)}
.agent-name{display:inline-block}

/* El latido vive en el propio número de posición: no añade otro símbolo ni roba
   espacio. Si el agente deja de emitir, el número recupera el estilo neutro. */
.rank-number{display:inline-grid;place-items:center;min-width:2ch;color:var(--dim);font-weight:800}
.rank-number.live{color:var(--good);font-weight:900;transform-origin:center;
  text-shadow:0 0 6px rgba(136,255,170,.95),0 0 13px rgba(136,255,170,.5);
  animation:rank-heartbeat 1.6s ease-in-out infinite}
@keyframes rank-heartbeat{0%,100%{transform:scale(1);opacity:1}45%{transform:scale(1.18);opacity:.48}60%{transform:scale(1.04);opacity:.9}}

/* Carrera de refresco: una calle por familia con trabajo canónico activo y
   actividad visible-v1 reciente o proceso verificado en esa misma máquina. */
.refresh-race{--track-start:2px;--finish-gutter:clamp(132px,15vw,184px);--finish-width:7px;--agent-gap:26px;
  position:relative;grid-column:2;grid-row:1;min-height:44px;min-width:0;padding:0;display:flex;align-items:flex-start;overflow:hidden;
  cursor:pointer;border-radius:5px}
.refresh-race:focus-visible{outline:2px solid var(--brand);outline-offset:4px}
.refresh-lanes{width:100%;display:grid;gap:1px}
.runner-symbols{position:absolute;width:0;height:0;overflow:hidden}
.refresh-lane{position:relative;width:100%;min-width:0;min-height:42px}
.refresh-track{position:relative;width:100%;min-height:42px;padding:1px calc(var(--finish-gutter) + var(--finish-width)) 16px var(--track-start)}
/* La pista nace en x=2, el mismo borde estable donde la ventana móvil de misión
   deja su M inicial. La diferencia vertical evita que la línea tape el rótulo. */
.refresh-track::before{content:"";position:absolute;left:var(--track-start);right:calc(var(--finish-gutter) + var(--finish-width));bottom:11px;height:2px;
  background:rgba(120,243,255,.22);box-shadow:0 1px 0 rgba(255,216,102,.16)}
.refresh-fill{position:absolute;left:var(--track-start);bottom:11px;width:0;height:2px;background:linear-gradient(90deg,var(--lane),var(--accent),var(--brand));
  box-shadow:0 0 7px color-mix(in srgb,var(--lane) 55%,transparent)}
.refresh-place{position:absolute;z-index:2;left:calc(var(--track-start) + 8px);bottom:0px;min-width:16px;padding:0 1px;
  transform:translateX(-50%) skewX(-8deg);transform-origin:center bottom;
  border:0;background:transparent;color:color-mix(in srgb,var(--lane) 88%,#fff);
  font-size:9px;font-weight:950;line-height:9px;text-align:center;letter-spacing:.03em;
  opacity:0;visibility:hidden;-webkit-text-stroke:.25px rgba(2,8,13,.9);
  text-shadow:0 1px 0 #02080d,0 0 6px color-mix(in srgb,var(--lane) 58%,transparent);
  transition:opacity .12s linear;pointer-events:none;user-select:none}
.refresh-lane.place-revealed .refresh-place{opacity:.88;visibility:visible}
.refresh-place-track{mix-blend-mode:normal}
.refresh-lane-p1{--lane:var(--oro);--runner-shirt:#ffd866;--runner-stripe:#8a4a2a}
.refresh-lane-p2{--lane:var(--plata);--runner-shirt:#e6ecf2;--runner-stripe:#3477c7}
.refresh-lane-p3{--lane:var(--bronce);--runner-shirt:#c87f3a;--runner-stripe:#2b1b12}
.refresh-lane-rank{--lane:#78f3ff;--runner-shirt:#8d5fd3;--runner-stripe:#ffd866}
.refresh-mission{position:absolute;z-index:1;left:0;top:5px;width:0;
  max-width:calc(100% - var(--finish-gutter) - var(--finish-width) - 8px);
  transform:translateX(calc(-100% - 13px));overflow:hidden;color:var(--mut);font-size:10px;font-weight:800;
  line-height:13px;letter-spacing:.015em;text-shadow:0 1px 5px #000;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .16s linear;will-change:left,width,opacity}
.refresh-lane.race-started .refresh-mission{opacity:1;visibility:visible}
.refresh-race.phase-ready .refresh-mission,.refresh-race.phase-set .refresh-mission,.refresh-race.phase-go .refresh-mission{
  opacity:0;visibility:hidden;transition:none}
.refresh-mission-title{display:block;width:100%;max-width:none;direction:ltr;unicode-bidi:plaintext;
  white-space:nowrap;text-align:center;transform:translateX(0);will-change:transform}
.refresh-mission-duration{display:none;color:var(--accent);font-weight:950;white-space:nowrap}
.refresh-lane.finished .refresh-mission{display:flex;align-items:baseline;justify-content:center;gap:6px}
.refresh-lane.finished .refresh-mission-duration{display:block;flex:0 0 auto}
.refresh-lane.finished .refresh-mission-title{display:block;width:auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.refresh-lane-empty{--lane:var(--dim);--runner-shirt:#78f3ff;--runner-stripe:#ffd866;min-height:42px}
.refresh-lane-empty .refresh-track{min-height:42px;padding:0 18px}
.refresh-lane-empty .refresh-track::before{display:none}
.refresh-lane-empty .refresh-mission{left:auto;right:42px;top:4px;width:auto;max-width:calc(100% - 72px);transform:none;
  color:var(--dim);font-size:10px;line-height:14px;letter-spacing:.1em;text-align:right;text-transform:uppercase;
  opacity:1;visibility:visible}
.refresh-race.phase-ready .refresh-lane-empty .refresh-mission,.refresh-race.phase-set .refresh-lane-empty .refresh-mission,
.refresh-race.phase-go .refresh-lane-empty .refresh-mission{opacity:1;visibility:visible}
.refresh-lane-empty .refresh-mission-title{width:auto}
.refresh-lane-empty .refresh-runner{bottom:11px}
/* Calle PARADA: el trabajo existe y sigue asignado, pero no avanza. El corredor se
   queda en la salida, la pista se apaga y el rótulo se ancla a la derecha —como en
   la calle vacía— porque pegado a la salida se saldría de la pista por la izquierda.
   Se ve siempre, no sólo al arrancar la carrera: es justo lo que hay que leer. */
.refresh-lane-idle{--lane:var(--dim);opacity:.72}
.refresh-lane-idle .refresh-fill{opacity:0}
.refresh-lane-idle .refresh-runner{filter:grayscale(1) brightness(.85)}
.refresh-lane-idle .refresh-mission{left:auto;right:42px;top:4px;width:auto;max-width:calc(100% - 82px);transform:none;
  text-align:right;opacity:1;visibility:visible}
.refresh-race.phase-ready .refresh-lane-idle .refresh-mission,.refresh-race.phase-set .refresh-lane-idle .refresh-mission,
.refresh-race.phase-go .refresh-lane-idle .refresh-mission{opacity:1;visibility:visible}
.refresh-lane-idle .refresh-mission-title{width:auto;text-align:right;opacity:.75}
.refresh-mission-idle{color:var(--dim);font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.refresh-agent{position:absolute;z-index:2;left:calc(100% - var(--finish-gutter) + var(--agent-gap));right:4px;bottom:7px;
  max-width:none;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  white-space:normal;text-align:left;color:var(--lane);font-size:12px;font-weight:900;line-height:14px;letter-spacing:.025em;
  text-shadow:0 1px 5px #000,0 0 7px color-mix(in srgb,var(--lane) 45%,transparent);pointer-events:none}
.refresh-runner{position:absolute;left:0;bottom:11px;width:25px;height:30px;transform:translateX(-50%);
  z-index:3;filter:drop-shadow(0 0 4px rgba(255,216,102,.45));will-change:left}
.refresh-runner svg{display:block;position:absolute;inset:0;width:100%;height:100%;overflow:visible;shape-rendering:crispEdges;
  image-rendering:pixelated}
.refresh-runner .runner-shirt{fill:var(--runner-shirt)}
.refresh-runner .runner-stripe,.refresh-runner .runner-accent{fill:var(--runner-stripe)}
.refresh-runner .runner-skin{fill:var(--runner-skin)}
/* Dos juegos de piel/pelo; el tono se asigna por hash del nombre del agente
   (runnerVariant en highscore-race.js), así cada agente conserva siempre el suyo. */
.refresh-runner.runner-dark,.refresh-runner.runner-skin-dark{--runner-skin:#9c5228;--runner-hair:#14100b}
.refresh-runner.runner-light,.refresh-runner.runner-skin-light{--runner-skin:#f8b98c;--runner-hair:#b45a1e}
.refresh-runner .runner-hair,.refresh-runner .runner-mustache{fill:var(--runner-hair)}
.refresh-finish{position:absolute;z-index:2;right:var(--finish-gutter);bottom:9px;width:var(--finish-width);height:32px;pointer-events:none}
.refresh-finish::before,.refresh-finish::after{content:"";position:absolute;left:0;width:100%;height:50%;
  border:1px solid rgba(223,248,255,.75);background:conic-gradient(#dff8ff 25%,#02080d 0 50%,#dff8ff 0 75%,#02080d 0) 0 0/6px 6px;
  box-shadow:0 0 7px rgba(120,243,255,.48);transition:transform .45s steps(3,end),opacity .45s linear}
.refresh-finish::before{top:0;border-bottom:0;transform-origin:bottom right}
.refresh-finish::after{bottom:0;border-top:0;transform-origin:top right}
.refresh-lane.cruzando .refresh-finish::before{transform:translate(-7px,-8px) rotate(-20deg);opacity:0}
.refresh-lane.cruzando .refresh-finish::after{transform:translate(7px,8px) rotate(20deg);opacity:0}
/* Cada fase muestra su sprite REAL (runnerReady/Set/Go) y la carrera es un ciclo
   de 3 zancadas (runnerRunA→B→C). Nada de rotate/scaleY fingiendo posturas:
   ese era el mecanismo que afeaba a los corredores. */
/* OJO especificidad: .refresh-runner svg (0,1,1) gana a una clase suelta (0,1,0);
   el mecanismo viejo pintaba por eso las poses de meta SUPERPUESTAS al ciclo.
   Todas las reglas de estado van prefijadas para ganar esa guerra. */
.refresh-runner .runner-pose-ready,.refresh-runner .runner-pose-set,.refresh-runner .runner-pose-go,
.refresh-runner .runner-finish-win,.refresh-runner .runner-finish-lose{display:none}
.runner-run-a{animation:runner-run-a .28s steps(1,end) infinite}
.runner-run-b{animation:runner-run-b .28s steps(1,end) infinite}
.runner-run-c{animation:runner-run-c .28s steps(1,end) infinite}
.refresh-race.phase-ready .runner-run-a,.refresh-race.phase-set .runner-run-a,.refresh-race.phase-go .runner-run-a,
.refresh-race.phase-ready .runner-run-b,.refresh-race.phase-set .runner-run-b,.refresh-race.phase-go .runner-run-b,
.refresh-race.phase-ready .runner-run-c,.refresh-race.phase-set .runner-run-c,.refresh-race.phase-go .runner-run-c,
.refresh-lane.finished .runner-run-a,.refresh-lane.finished .runner-run-b,.refresh-lane.finished .runner-run-c{display:none;animation:none}
.refresh-race.phase-ready .runner-pose-ready{display:block;opacity:1}
.refresh-race.phase-set .runner-pose-set{display:block;opacity:1}
.refresh-race.phase-go .runner-pose-go{display:block;opacity:1}
.refresh-lane.finished.race-winner .runner-finish-win{display:block;animation:none;opacity:1}
.refresh-lane.finished.race-loser .runner-finish-lose{display:block;animation:none;opacity:1}
/* El gesto del final se ANIMA como en el arcade: el ganador bombea los brazos
   (arriba ↔ junto a la cabeza) y el perdedor se rasca en dos tiempos. Dos <use>
   alternados con steps, patrón idéntico al ciclo de carrera. */
.runner-finish-win .gesto-a,.runner-finish-lose .gesto-a{animation:runner-gesto-a .64s steps(1,end) infinite}
.runner-finish-win .gesto-b,.runner-finish-lose .gesto-b{animation:runner-gesto-b .64s steps(1,end) infinite}
@keyframes runner-gesto-a{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes runner-gesto-b{0%,49%{opacity:0}50%,100%{opacity:1}}
.race-call{--call:#ffd866;--call-rgb:255,216,102;--call-deep:#5e3200;
  position:absolute;z-index:5;left:var(--track-start);right:calc(var(--finish-gutter) + var(--finish-width));top:50%;
  box-sizing:border-box;width:max-content;min-width:clamp(112px,12vw,158px);
  max-width:calc(100% - var(--track-start) - var(--finish-gutter) - var(--finish-width) - 8px);
  margin-inline:auto;padding:3px 18px;transform:translateY(-50%);isolation:isolate;
  border:2px solid var(--call);border-radius:2px;outline:2px solid #02080d;
  background:repeating-linear-gradient(90deg,var(--call-deep) 0 5px,#120b08 5px 10px);
  color:#fffce0;font-size:clamp(18px,2vw,24px);font-weight:950;line-height:23px;letter-spacing:.2em;text-align:center;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);
  text-shadow:2px 2px 0 #02080d,-1px -1px 0 #02080d,0 0 9px var(--call),0 0 18px rgba(var(--call-rgb),.85);
  box-shadow:0 0 0 2px rgba(var(--call-rgb),.25),inset 0 0 0 2px rgba(2,8,13,.78),
    inset 0 -7px 0 rgba(0,0,0,.24),0 0 18px rgba(var(--call-rgb),.72),0 0 34px rgba(var(--call-rgb),.28);
  opacity:0;pointer-events:none}
.race-call::before{content:"";position:absolute;z-index:-1;inset:-7px;border:1px solid rgba(var(--call-rgb),.8);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  box-shadow:0 0 12px rgba(var(--call-rgb),.75)}
.race-call::after{content:"";position:absolute;z-index:1;inset:2px;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(255,255,255,.1) 3px 4px);mix-blend-mode:screen}
.refresh-race.phase-ready .race-call,.refresh-race.phase-set .race-call,.refresh-race.phase-go .race-call{opacity:1}
.refresh-race.phase-ready .race-call{--call:#78f3ff;--call-rgb:120,243,255;--call-deep:#063846;
  color:#eaffff;border-color:#78f3ff;background:repeating-linear-gradient(90deg,#063846 0 5px,#07161d 5px 10px);
  animation:race-call-ready .46s steps(2,end) infinite alternate}
.refresh-race.phase-set .race-call{--call:#ffd866;--call-rgb:255,216,102;--call-deep:#5e3200;
  color:#fff7b8;border-color:#ffd866;background:repeating-linear-gradient(90deg,#5e3200 0 5px,#1b1005 5px 10px);
  animation:race-call-set .38s cubic-bezier(.2,.9,.3,1) infinite alternate}
.refresh-race.phase-go .race-call{--call:#88ffaa;--call-rgb:136,255,170;--call-deep:#064625;
  color:#ecfff1;border-color:#88ffaa;background:repeating-linear-gradient(90deg,#064625 0 5px,#06170d 5px 10px);
  animation:race-call-go .72s cubic-bezier(.12,.8,.2,1) both}
@keyframes race-call-ready{from{filter:brightness(.9);letter-spacing:.17em}to{filter:brightness(1.35);letter-spacing:.23em}}
@keyframes race-call-set{from{transform:translateY(-50%) scaleX(.94);filter:brightness(1)}to{transform:translateY(-50%) scaleX(1.06);filter:brightness(1.45)}}
@keyframes race-call-go{0%{transform:translateY(-50%) scale(.72);opacity:.05;filter:brightness(2.2)}42%{transform:translateY(-50%) scale(1.18);opacity:1;filter:brightness(1.65)}100%{transform:translateY(-50%) scale(1);opacity:1;filter:brightness(1)}}
.refresh-race.paused .refresh-runner svg{animation-play-state:paused}
@keyframes runner-run-a{0%,32%{opacity:1}33%,100%{opacity:0}}
@keyframes runner-run-b{0%,32%{opacity:0}33%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes runner-run-c{0%,65%{opacity:0}66%,100%{opacity:1}}

/* tabla */
.table-scroll{width:100%;margin-top:14px;overflow-x:auto;overflow-y:hidden;
  border-top:1px solid rgba(120,243,255,.12);box-shadow:0 0 30px rgba(2,8,13,.45)}
.tabla{width:100%;min-width:860px;border-collapse:collapse;table-layout:fixed;font-size:12.5px;
  background:rgba(2,8,13,.68)}
.tabla th{text-align:left;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  position:relative;padding:7px 13px 7px 10px;border-bottom:2px solid var(--line2);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sort-head{appearance:none;display:flex;align-items:center;gap:5px;width:100%;min-width:0;padding:0;border:0;
  background:transparent;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;text-align:inherit;
  cursor:pointer;white-space:nowrap}
.tabla th.num .sort-head{justify-content:flex-end}
.sort-label-stack{display:inline-flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.05}
.sort-head:hover,.sort-head:focus-visible{color:var(--brand);outline:none;text-shadow:0 0 7px rgba(120,243,255,.35)}
.sort-arrow{display:inline-block;min-width:1em;color:var(--accent);font-size:9px;text-align:center}
.tabla th[aria-sort="ascending"] .sort-head,.tabla th[aria-sort="descending"] .sort-head{color:var(--ink)}
.rank-filter{appearance:none;display:grid;place-items:center;width:100%;padding:0;border:0;background:transparent;
  color:var(--dim);font:900 12px/1 var(--mono);cursor:pointer}
.rank-filter:hover,.rank-filter:focus-visible{color:var(--brand);outline:none;text-shadow:0 0 7px rgba(120,243,255,.35)}
.rank-filter[aria-pressed="true"]{color:var(--good);text-shadow:0 0 6px rgba(136,255,170,.95),0 0 13px rgba(136,255,170,.5);
  animation:rank-heartbeat 1.6s ease-in-out infinite}
.tabla td{padding:8px 10px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis}
/* Zebra deliberadamente marcada: los puestos pares son más oscuros que los
   impares para poder seguir una fila completa sin perderla entre números. */
.tabla tbody tr:nth-child(odd){background:#0a1821}
.tabla tbody tr:nth-child(even){background:#01060a}
.tabla tbody tr:hover{background:#102b38}
/* La segunda línea de cada agente cuenta el recorrido del trabajo. No presupone
   enlaces: cuando la API sólo trae agregados lo declara como resumen del día. */
.tabla tbody tr.score-main{background:#0a1821}
.tabla tbody tr.score-main.alt{background:#01060a}
.tabla tbody tr.score-main:hover,.tabla tbody tr.score-main:hover+.score-progress{background:#102b38}
.tabla tbody tr.score-progress{background:#061018}
.tabla tbody tr.score-progress.alt{background:#000509}
.score-progress td{padding:0 10px 9px;border-bottom:1px solid rgba(120,243,255,.28);overflow:visible}
.progression{position:relative;display:grid;grid-template-columns:minmax(104px,.8fr) repeat(6,minmax(82px,1fr));
  align-items:start;gap:7px;min-width:879px;padding:7px 0 2px}
.progression-meta{align-self:center;min-width:0;padding-right:7px;color:var(--dim);font-size:8.5px;line-height:1.35;
  letter-spacing:.11em;text-transform:uppercase}
.progression-meta strong{display:block;color:var(--mut);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progression-meta[data-linked="true"] strong{color:var(--brand)}
.progression-step{position:relative;display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:5px;align-items:center;
  min-width:0;color:var(--dim)}
.progression-step::before{content:"";position:absolute;z-index:0;left:-8px;right:calc(100% - 2px);top:8px;height:2px;
  background:rgba(77,122,136,.26)}
.progression-step:first-of-type::before{display:none}
.progression-step.origin::before{display:none}
.progression-step.pre-origin{opacity:.2}
.progression-dot{position:relative;z-index:1;display:grid;place-items:center;width:16px;height:16px;border:2px solid currentColor;
  border-radius:50%;background:#061018;font-size:8px;font-weight:950;line-height:1}
.progression-copy{min-width:0}.progression-label{display:block;color:currentColor;font-size:8.5px;font-weight:900;letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progression-value{display:block;margin-top:2px;color:var(--dim);font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progression-step.completed{color:var(--brand)}
.progression-step.completed::before,.progression-step.active::before,.progression-step.new::before{
  background:linear-gradient(90deg,var(--brand),var(--good));box-shadow:0 0 6px rgba(120,243,255,.42)}
.progression-step.active{color:var(--good)}
.progression-step.active .progression-dot{background:rgba(136,255,170,.18);box-shadow:0 0 0 3px rgba(136,255,170,.11),0 0 10px rgba(136,255,170,.7)}
.progression-step.new{color:var(--accent)}
.progression-step.new .progression-dot{border-radius:4px;background:rgba(255,216,102,.2);
  box-shadow:0 0 0 3px rgba(255,216,102,.12),0 0 12px rgba(255,216,102,.8);animation:new-arrival 1.25s ease-in-out infinite}
.progression-step.future{opacity:.55}
/* SIGUIENTE VENTANA: a la derecha de PUNTOS, cuánto le queda al agente para
   poder abrir por su cuenta la próxima ventana de decisión. No es una etapa de
   la cadena —mira hacia adelante, no hacia atrás—, así que no lleva el hilo que
   une las cinco anteriores y su aro va punteado mientras espera. Cuando la
   puerta está abierta se pone verde, como la línea bajo el nombre. */
.progression-step.next-window{color:var(--brand)}
.progression-step.next-window::before{display:none}
.progression-step.next-window .progression-dot{border-style:dashed}
.progression-step.next-window .progression-value{color:var(--mut);font-variant-numeric:tabular-nums}
.progression-step.next-window.libre{color:var(--good)}
.progression-step.next-window.libre .progression-dot{border-style:solid;background:rgba(136,255,170,.18);
  box-shadow:0 0 0 3px rgba(136,255,170,.11),0 0 10px rgba(136,255,170,.7)}
.progression-step.next-window.libre .progression-value{color:var(--good)}
@keyframes new-arrival{50%{transform:scale(.8);box-shadow:0 0 0 7px rgba(255,216,102,.04),0 0 5px rgba(255,216,102,.35)}}
.col-resizer{position:absolute;z-index:3;top:0;right:-2px;width:9px;height:100%;cursor:col-resize;
  touch-action:none;outline:0}
.col-resizer::before{content:"";position:absolute;top:22%;bottom:22%;left:4px;width:1px;
  background:rgba(120,243,255,.22);transition:background .15s,box-shadow .15s}
.col-resizer:hover::before,.col-resizer:focus-visible::before,.col-resizer.dragging::before{
  background:var(--brand);box-shadow:0 0 7px var(--brand)}
body.resizing-columns{cursor:col-resize;user-select:none}
.tabla .n{color:var(--dim);width:38px}
.tabla .ag{font-weight:700}
.tabla .num{text-align:right;font-variant-numeric:tabular-nums}
.tabla .tot{text-align:right;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
/* El nombre del agente es el gatillo de su ventana de decisión: parece texto y
   se descubre al pasar por encima, para no convertir la tabla en un panel de
   botones. Sin proyecto de censo no se pinta (ver agentNameHtml). */
.agent-launch{appearance:none;padding:0;border:0;background:none;color:inherit;font:inherit;
  cursor:pointer;border-bottom:1px dashed transparent;text-align:left}
.agent-launch:hover,.agent-launch:focus-visible{color:var(--brand);border-bottom-color:var(--brand);outline:none}
.agent-launch.lanzando{opacity:.6;cursor:progress}
.agent-launch.rechazado{color:#ffb454;border-bottom-color:rgba(255,180,84,.5)}
/* LÍNEA DE LA VENTANA AUTÓNOMA, bajo cada agente. El reloj se pone a cero en
   cada ventana y corre 60 minutos; al cumplirse, el agente puede volver a abrir. El relleno lleva su propio degradado en línea (JS) porque el tono
   evoluciona con el progreso: cian al empezar, ámbar al filo. */
.hourbar{display:block;position:relative;height:3px;margin:5px 0 1px;border-radius:2px;
  background:rgba(120,243,255,.10);overflow:hidden}
.hourbar>i{display:block;height:100%;border-radius:2px;transition:width .6s linear}
/* LIBRE: esta hora no la ha usado, puede abrir ya. Verde y con latido: no es un
   progreso, es una puerta abierta — por eso el relleno se ignora y va entero. */
.hourbar.libre{background:rgba(136,255,170,.16)}
.hourbar.libre>i{width:100%!important;
  background:linear-gradient(90deg,rgba(136,255,170,.35),var(--good,#88ffaa))!important;
  animation:hourbar-libre 2.4s ease-in-out infinite}
@keyframes hourbar-libre{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){
  .hourbar>i{transition:none}
  .hourbar.libre>i{animation:none}
}

/* INDICADORES: hora/día en una sola base tipográfica para Objetivos, Ventana,
   Misiones, Tareas y Puntos. Verde = hubo actividad en la hora; ámbar = cero. */
.score-toggle{appearance:none;display:inline-flex;align-items:center;justify-content:flex-end;
  max-width:100%;padding:2px 3px;
  border:1px solid transparent;border-radius:5px;background:transparent;color:inherit;font:inherit;font-weight:inherit;
  font-variant-numeric:inherit;cursor:pointer}
.score-toggle:hover,.score-toggle:focus-visible{border-color:var(--brand);outline:none;background:rgba(120,243,255,.08);
  box-shadow:0 0 8px rgba(120,243,255,.2)}
.score-toggle[aria-expanded="true"]{color:var(--ink);border-color:rgba(120,243,255,.42)}
.score-pair{display:inline-flex;align-items:baseline;justify-content:flex-end;gap:.24em;
  font:inherit;font-size:inherit;font-weight:inherit;line-height:inherit;letter-spacing:inherit;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.score-number,.score-separator{font:inherit;font-size:inherit;font-weight:inherit;line-height:inherit;vertical-align:baseline}
.score-period{color:var(--mut);font-size:.47em;font-weight:850;line-height:1;letter-spacing:.08em;text-transform:uppercase}
.score-hour.hour-positive{color:var(--good);text-shadow:0 0 8px rgba(136,255,170,.72)}
.score-hour.hour-zero{color:var(--accent)}
.score-separator{color:var(--dim)}
.score-day.daily-up{color:var(--good);text-shadow:0 0 8px rgba(136,255,170,.72)}
.score-day.daily-down{color:var(--warn)}
.score-day.daily-initial{color:var(--mut)}
.score-progress[hidden]{display:none}
.project-cell{max-width:150px}
.project-chip{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--brand);font-size:10px;letter-spacing:.025em;text-decoration:none;border-bottom:1px solid rgba(120,243,255,.25)}
.project-chip:hover{color:var(--ink);border-bottom-color:var(--brand)}
/* proyecto PRINCIPAL (del censo, no de la faena de hoy): mismo dato, menos voz,
   para distinguir de un vistazo quién está metido en su proyecto ahora mismo */
.project-chip.principal{color:var(--mut);border-bottom-style:dotted;border-bottom-color:rgba(120,243,255,.18)}
.project-chip.principal:hover{color:var(--ink);border-bottom-color:var(--brand)}
/* sin proyecto en el censo: el comodín. Ámbar porque es deuda de configuración,
   no un estado normal — debería verse casi nunca */
.project-chip.defecto{color:#ffb454;border-bottom-color:rgba(255,180,84,.3)}
.project-empty{color:var(--dim)}
.activity-now{position:relative;display:inline-grid;place-items:center;min-width:2ch;color:var(--good);font-weight:900;
  text-shadow:0 0 5px rgba(136,255,170,.95),0 0 12px rgba(136,255,170,.5);animation:work-pulse 1.15s ease-in-out infinite}
.activity-now::after{content:"";position:absolute;inset:-4px -6px;border:1px solid rgba(136,255,170,.5);
  border-radius:6px;box-shadow:0 0 8px rgba(136,255,170,.22);animation:work-ring 1.15s ease-in-out infinite;pointer-events:none}
@keyframes work-pulse{50%{color:#dfffe8;text-shadow:0 0 2px rgba(136,255,170,.4);opacity:.48}}
@keyframes work-ring{50%{transform:scale(.82);opacity:.12}}
.rt{font-size:9.5px;color:var(--dim);letter-spacing:.06em}
/* Ordenadores donde corre el agente. Encendido = latiendo ahora; apagado = conocido
   pero sin latido reciente. Un agente puede estar en varios a la vez (Smith en 8). */
.maqs{display:flex;flex-wrap:wrap;gap:4px;max-width:340px}
.maq-b{font-size:9.5px;letter-spacing:.04em;padding:2px 6px;border:1px solid var(--line);
  border-radius:4px;color:var(--dim);white-space:nowrap}
.maq-b.on{color:var(--good);border-color:rgba(136,255,170,.42);background:rgba(136,255,170,.08)}
.maq-mas{font-size:9.5px;color:var(--dim);align-self:center}
.nota{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:26px}
.nota h2{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);margin:0 0 10px}
.nota p,.nota li{font-size:11.5px;color:var(--mut);line-height:1.7;margin:0}
.nota ul{margin:0;padding-left:18px}
.nota b{color:var(--ink)}
.score-formula{padding:0;overflow:hidden}
.score-formula>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;
  color:var(--brand);cursor:pointer;list-style:none;user-select:none}
.score-formula>summary::-webkit-details-marker{display:none}
.score-formula>summary:hover,.score-formula>summary:focus-visible{background:rgba(120,243,255,.07);outline:none}
.score-formula-title{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.score-formula-toggle{flex:0 0 auto;color:var(--dim);font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.score-formula-toggle::before{content:"Mostrar  ▸"}
.score-formula[open] .score-formula-toggle::before{content:"Ocultar  ▾"}
.score-formula-body{padding:0 18px 16px;border-top:1px solid rgba(120,243,255,.08)}
.score-formula-body>ul{margin-top:12px}
.err{border-color:rgba(255,136,102,.4);background:rgba(255,136,102,.07)}
.err h2{color:var(--warn)}
/* En la cabecera, NO fijo abajo a la derecha: ahí tapaba las últimas filas de la tabla. */
.sonido{position:relative;display:grid;place-items:center;width:15px;height:15px;margin:0;padding:0;background:var(--card2);
  border:1px solid var(--line2);border-radius:50%;color:var(--dim);font-family:var(--mono);font-size:7px;line-height:1;cursor:pointer}
.sonido:hover,.sonido[aria-pressed="true"]{color:var(--brand);border-color:var(--brand);box-shadow:0 0 12px rgba(120,243,255,.22)}
.sonido[aria-pressed="false"]::after{content:"";position:absolute;width:9px;height:1px;background:currentColor;transform:rotate(-45deg)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.agent-scope{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.agent-scope-head{appearance:none;display:flex;align-items:center;gap:7px;width:100%;padding:0;border:0;background:transparent;
  color:var(--brand);font-family:inherit;font-size:9px;font-weight:900;letter-spacing:.13em;text-align:left;text-transform:uppercase;cursor:pointer}
.agent-scope-head:hover,.agent-scope-head:focus-visible{color:var(--ink);outline:none}
.agent-scope-chevron{flex:0 0 auto;width:9px;color:var(--brand);font-size:10px;line-height:1}
.agent-scope-chevron::before{content:"▸"}.agent-scope-head[aria-expanded="true"] .agent-scope-chevron::before{content:"▾"}
.agent-scope-count{flex:0 0 auto;border:1px solid var(--line2);border-radius:999px;padding:2px 7px;color:var(--accent);
  margin-left:auto;font-size:8px;letter-spacing:.03em;text-transform:none;white-space:nowrap}
.agent-scope-body{display:grid;gap:10px}.agent-scope-body[hidden]{display:none}
.agent-scope-help{margin:0;color:var(--dim);font-size:9px;line-height:1.5}
.agent-scope-list{display:grid;gap:4px;max-height:min(52vh,430px);overflow:auto;padding-right:2px;scrollbar-width:thin}
.agent-scope-presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:3px;border:1px solid rgba(255,216,102,.28);border-radius:8px;background:rgba(2,8,13,.55)}
.agent-scope-preset{appearance:none;min-width:0;padding:7px 5px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--dim);
  font:900 8px/1.15 var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.agent-scope-preset:hover,.agent-scope-preset:focus-visible{border-color:var(--brand);color:var(--ink);outline:none}
.agent-scope-preset[aria-checked="true"]{border-color:rgba(136,255,170,.55);background:rgba(136,255,170,.09);color:var(--good)}
.agent-scope-presence{grid-column:1/-1;margin:1px 4px 2px;color:var(--dim);font-size:7.5px;line-height:1.35;text-align:center}
.agent-scope-presence.stale{color:var(--warn)}
.agent-scope-row{display:grid;align-items:center;gap:7px;min-height:28px;
  padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:rgba(120,243,255,.025);color:var(--mut);
  font:700 9.5px/1.2 var(--mono)}
.agent-scope-row:hover,.agent-scope-row:focus-within{border-color:var(--brand);color:var(--ink);background:rgba(120,243,255,.08)}
.agent-scope-row.all{appearance:none;grid-template-columns:minmax(0,1fr) auto 28px;width:100%;border-color:rgba(255,216,102,.25);
  color:var(--accent);font-weight:900;text-align:left;cursor:pointer}
.agent-scope-group{display:grid;min-width:0;margin:0;padding:0;border:0;gap:4px}
.agent-scope-row.team{grid-template-columns:minmax(0,1fr) auto;padding:0;border-color:rgba(120,243,255,.24);color:var(--ink);
  background:rgba(120,243,255,.08);font-weight:900}
.agent-scope-team-toggle{appearance:none;display:grid;grid-template-columns:minmax(0,1fr) auto 12px;align-items:center;gap:7px;
  min-width:0;align-self:stretch;min-height:28px;padding:5px 7px;border:0;
  background:transparent;color:inherit;font:900 9.5px/1.2 var(--mono);letter-spacing:inherit;text-align:left;cursor:pointer}
.agent-scope-team-toggle::after{content:"▸";color:var(--brand);font-size:12px;text-align:center}
.agent-scope-team-toggle[aria-expanded="true"]::after{content:"▾"}
.agent-scope-team-toggle:hover,.agent-scope-team-toggle:focus-visible{background:rgba(120,243,255,.12);outline:1px solid var(--brand);outline-offset:-1px}
.agent-scope-team-count{min-width:20px;padding:1px 5px;border:1px solid var(--line);border-radius:999px;color:var(--dim);
  font-size:8px;text-align:center}
.agent-scope-team-select{appearance:none;display:grid;grid-template-columns:auto 28px;align-items:center;gap:5px;align-self:stretch;
  min-width:62px;padding:4px 6px;border:0;border-left:1px solid rgba(120,243,255,.14);background:rgba(120,243,255,.025);
  color:var(--dim);font:700 7.5px/1 var(--mono);text-align:center;text-transform:uppercase;cursor:pointer}
.agent-scope-team-select:hover,.agent-scope-team-select:focus-visible{background:rgba(120,243,255,.13);outline:1px solid var(--brand);outline-offset:-1px}
.agent-scope-children{display:grid;gap:3px;padding-left:14px;border-left:1px solid rgba(120,243,255,.14)}
.agent-scope-children[hidden]{display:none}
.agent-scope-children .agent-scope-row{min-height:25px;background:rgba(120,243,255,.018)}
.agent-scope-row.agent{grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:4px 6px}
.agent-scope-primary{appearance:none;display:grid;grid-template-columns:minmax(0,1fr) auto 28px;align-items:center;gap:7px;min-width:0;width:100%;
  grid-column:1;grid-row:1;padding:0;border:0;background:transparent;color:inherit;font:700 9.5px/1.2 var(--mono);text-align:left;cursor:pointer}
.agent-scope-switch-state{color:var(--dim);font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.agent-scope-switch-track{position:relative;width:26px;height:14px;border:1px solid currentColor;border-radius:999px;color:var(--dim)}
.agent-scope-switch-track::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:currentColor;transition:transform .16s}
.agent-scope-switch[aria-checked="true"]{color:var(--good);border-color:rgba(136,255,170,.45);background:rgba(136,255,170,.05)}
.agent-scope-switch[aria-checked="true"] .agent-scope-switch-state{color:var(--good)}
.agent-scope-switch[aria-checked="true"] .agent-scope-switch-track{color:var(--good)}
.agent-scope-switch[aria-checked="true"] .agent-scope-switch-track::after{transform:translateX(12px)}
.agent-scope-switch[aria-checked="mixed"] .agent-scope-switch-state,.agent-scope-switch[aria-checked="mixed"] .agent-scope-switch-track{color:var(--accent)}
.agent-scope-app-feedback{grid-column:1/-1;grid-row:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim);
  font-size:8px;line-height:1.2;text-align:right}
.agent-scope-app-feedback:empty{display:none}
.agent-scope-app-feedback.pending{color:var(--brand)}
.agent-scope-app-feedback.success{color:var(--good)}
.agent-scope-app-feedback.error{color:var(--warn)}
.agent-scope-running{appearance:none;display:grid;place-items:center;width:24px;height:24px;padding:0;border:1px solid rgba(255,216,102,.18);
  grid-column:2;grid-row:1;border-radius:5px;background:transparent;color:var(--dim);font:13px/1 var(--mono);cursor:pointer;filter:grayscale(1);opacity:.52}
.agent-scope-running[aria-checked="true"]{border-color:rgba(255,216,102,.72);color:var(--accent);background:rgba(255,216,102,.09);
  box-shadow:0 0 9px rgba(255,216,102,.18);filter:none;opacity:1}
.agent-scope-running[aria-busy="true"]{border-color:var(--brand);color:var(--brand);filter:none;opacity:1;animation:app-toggle-wait .8s steps(2,end) infinite}
.agent-scope-running:hover,.agent-scope-running:focus-visible{border-color:var(--accent);filter:none;opacity:1;outline:none}
.agent-scope-running:disabled{cursor:not-allowed;filter:grayscale(1);opacity:.28}
@keyframes app-toggle-wait{50%{opacity:.35}}
.agent-scope-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-scope-actions{display:grid;gap:6px}
.agent-scope-reset,.agent-scope-clone{appearance:none;width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:7px;
  background:rgba(120,243,255,.05);color:var(--brand);font:900 9px/1.2 var(--mono);letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;text-align:center}
.agent-scope-clone{border-color:rgba(255,216,102,.35);color:var(--accent);background:rgba(255,216,102,.06)}
.agent-scope-reset:hover,.agent-scope-reset:focus-visible,.agent-scope-clone:hover,.agent-scope-clone:focus-visible{border-color:var(--brand);background:rgba(120,243,255,.12);outline:none}
.agent-scope-status{min-height:14px;margin:0;color:var(--good);font-size:9px;line-height:1.45}
.agent-scope-empty{padding:8px;color:var(--dim);font-size:9px;line-height:1.45}

/* ─────────── CONTROL DE CLIs (misión #1278) ───────────
   Mismos tokens que «Seguimiento de agentes»: es otro panel del riel Avanzado,
   no una isla con estética propia. Lo único que se separa a conciencia es el
   ESTADO: «parado» y «sin noticias» NO se pintan igual, porque uno es un hecho
   (la máquina late y dice que no corre) y el otro es ignorancia (nadie late
   allí). Confundirlos haría arrancar a ciegas algo que ya está en marcha. */
.cli-ctl{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
/* La cabecera ES el interruptor de la sección: botón a todo lo ancho, con el
   recuento pegado a la derecha para que se lea con la sección cerrada. */
.cli-ctl-head{appearance:none;display:flex;align-items:center;gap:7px;width:100%;padding:0;border:0;
  background:transparent;color:var(--brand);font-family:inherit;font-size:9px;font-weight:900;
  letter-spacing:.13em;text-transform:uppercase;text-align:left;cursor:pointer}
.cli-ctl-head:hover,.cli-ctl-head:focus-visible{color:var(--ink);outline:none}
.cli-ctl-head .cli-ctl-count{margin-left:auto}
.cli-ctl-chevron{flex:0 0 auto;width:9px;color:var(--brand);font:900 10px/1 var(--mono)}
.cli-ctl-chevron::before{content:"\25B8"}
[aria-expanded="true"]>.cli-ctl-chevron::before{content:"\25BE"}
.cli-ctl-body{display:grid;gap:8px}
.cli-ctl-body[hidden]{display:none}
.cli-ctl-clis{display:grid;gap:3px}
.cli-ctl-clis[hidden]{display:none}
.cli-ctl-count{flex:0 0 auto;border:1px solid var(--line2);border-radius:999px;padding:2px 7px;color:var(--accent);
  font-size:8px;letter-spacing:.03em;text-transform:none}
.cli-ctl-help{margin:0;color:var(--dim);font-size:8.5px;line-height:1.4}
.cli-ctl-list{display:grid;gap:5px;max-height:min(46vh,400px);overflow:auto;padding-right:2px;scrollbar-width:thin}
.cli-ctl-group{display:grid;min-width:0;margin:0;padding:0;border:0;gap:3px}
/* La barra del ordenador ES su interruptor: toda ella, no un triangulito. Mismo
   criterio que el seguimiento de agentes (FLT-1320). */
.cli-ctl-machine{appearance:none;display:flex;align-items:center;gap:7px;width:100%;min-height:24px;padding:4px 7px;
  border:1px solid rgba(120,243,255,.24);border-radius:7px;background:rgba(120,243,255,.08);color:var(--ink);
  font-family:inherit;font-size:9px;font-weight:900;letter-spacing:.05em;text-align:left;cursor:pointer}
.cli-ctl-machine:hover,.cli-ctl-machine:focus-visible{border-color:var(--brand);background:rgba(120,243,255,.14);outline:none}
.cli-ctl-tally{margin-left:auto;min-width:26px;padding:1px 5px;border:1px solid var(--line);border-radius:999px;
  color:var(--dim);font-size:8px;font-weight:400;text-align:center}
.cli-ctl-tally.viva{color:var(--good);border-color:rgba(136,255,170,.35)}
.cli-ctl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;
  padding:4px 7px;border:1px solid var(--line);border-radius:7px;background:rgba(120,243,255,.025);
  color:var(--mut);font-size:9.5px;line-height:1.25}
.cli-ctl-row:hover,.cli-ctl-row:focus-within{border-color:var(--brand);color:var(--ink);background:rgba(120,243,255,.06)}
.cli-ctl-name{display:grid;gap:3px;min-width:0}
.cli-ctl-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* El nombre de un CLI despierto es un botón: abre el cuadro para escribirle una
   misión. La pluma avisa de que ahí se puede pulsar; sin ella parecería texto. */
.cli-ctl-label.enviable{appearance:none;display:flex;align-items:center;gap:5px;padding:0;border:0;background:transparent;
  color:var(--ink);font:inherit;text-align:left;cursor:text}
.cli-ctl-label.enviable:hover,.cli-ctl-label.enviable:focus-visible{color:var(--brand);outline:none}
.cli-ctl-pluma{flex:0 0 auto;color:var(--dim);font-size:9px}
.cli-ctl-label.enviable:hover .cli-ctl-pluma,.cli-ctl-label.enviable:focus-visible .cli-ctl-pluma{color:var(--brand)}
.cli-ctl-row.componiendo{grid-template-columns:minmax(0,1fr) auto;border-color:var(--brand);background:rgba(120,243,255,.07)}
.cli-ctl-mision{grid-column:1/-1;display:grid;gap:5px;margin-top:2px}
.cli-ctl-mision-tx{width:100%;min-height:52px;padding:6px 7px;border:1px solid var(--line2);border-radius:7px;
  background:rgba(2,8,13,.6);color:var(--ink);font:400 9.5px/1.4 var(--mono);resize:vertical}
.cli-ctl-mision-tx:focus{border-color:var(--brand);outline:none}
.cli-ctl-mision-pie{display:flex;gap:5px;justify-content:flex-end}
.cli-ctl-act.cancelar{color:var(--dim);border-color:var(--line)}
.cli-ctl-state{display:inline-flex;align-items:center;gap:5px;font-size:8px;font-weight:900;
  letter-spacing:.09em;text-transform:uppercase;cursor:help}
.cli-ctl-state.viva{color:var(--good)}
.cli-ctl-state.parada{color:var(--dim)}
.cli-ctl-state.muda{color:var(--violet)}
.cli-ctl-dot{display:grid;place-items:center;width:11px;height:11px;border-radius:999px;font-size:8px;line-height:1}
.cli-ctl-state.viva .cli-ctl-dot{background:rgba(136,255,170,.16);box-shadow:0 0 6px rgba(136,255,170,.5)}
.cli-ctl-state.parada .cli-ctl-dot{border:1px solid currentColor}
.cli-ctl-state.muda .cli-ctl-dot{border:1px dashed currentColor}
.cli-ctl-act{appearance:none;padding:6px 8px;border:1px solid var(--line2);border-radius:7px;
  background:rgba(120,243,255,.05);color:var(--brand);font:900 8.5px/1.2 var(--mono);letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap;cursor:pointer}
.cli-ctl-act.stop{border-color:rgba(255,136,102,.42);color:var(--warn);background:rgba(255,136,102,.07)}
.cli-ctl-act.ciega{border-style:dashed;border-color:rgba(170,136,255,.5);color:var(--violet);background:rgba(170,136,255,.07)}
.cli-ctl-act:hover,.cli-ctl-act:focus-visible{border-color:var(--brand);background:rgba(120,243,255,.12);outline:none}
.cli-ctl-act[disabled]{opacity:.55;cursor:progress}
.cli-ctl-wait{grid-column:1/-1;margin:2px 0 0;color:var(--accent);font-size:8.5px;line-height:1.45}
.cli-ctl-status{min-height:14px;margin:0;color:var(--good);font-size:9px;line-height:1.45}
.cli-ctl-status.error{color:var(--warn)}
.cli-ctl-empty{padding:8px;color:var(--dim);font-size:9px;line-height:1.45}
.cli-ctl-meta{grid-column:1/-1;margin:0;color:var(--dim);font-size:8.5px;line-height:1.45;overflow-wrap:anywhere}
.cli-ctl-meta b{color:var(--mut);font-weight:800}.cli-ctl-surface{display:inline-flex;align-items:center;width:max-content;
  padding:1px 5px;border:1px solid var(--line);border-radius:999px;color:var(--brand);font-size:7.5px;font-weight:900;letter-spacing:.08em}
.cli-ctl-surface.app{color:var(--accent);border-color:rgba(255,216,102,.35)}
@media (max-width:620px){.podio{margin-top:20px}.plaza{width:27%;padding:4px 5px;gap:4px;background:rgba(2,8,13,.78)}
  .plaza.p2{left:7%;top:62%}.plaza.p1{left:36.5%;top:59%}.plaza.p3{right:6%;top:66%}
  .nom{font-size:7px}.pts{font-size:10px}
  .wrap{padding-top:46px}header.cab{grid-template-columns:auto minmax(90px,1fr);gap:10px}h1{font-size:17px}
  .refresh-race{--track-start:2px;--finish-gutter:clamp(94px,28vw,112px);--agent-gap:26px;padding:0 10px}
  .refresh-track{padding-left:var(--track-start);padding-right:calc(var(--finish-gutter) + var(--finish-width))}
  .refresh-mission{max-width:calc(100% - var(--finish-gutter) - var(--finish-width) - 5px);font-size:9px;line-height:13px}.refresh-mission-title{font-size:9px}
  .refresh-place{left:calc(var(--track-start) + 8px);bottom:0px;min-width:16px;font-size:9px;line-height:9px}
  .refresh-agent{left:calc(100% - var(--finish-gutter) + var(--agent-gap));right:2px;bottom:6px;font-size:9px;line-height:11px}
  .race-call{min-width:min(96px,calc(100% - var(--track-start) - var(--finish-gutter) - var(--finish-width) - 8px));

  .agent-scope-app-feedback{font-size:7.5px;text-align:left}}

    return '<span class="hourbar' + (v.abierta ? "" : " libre") + '" data-yk-hourbar="1"' +
      ' data-abierta="' + (v.abierta ? "1" : "0") + '" data-at="' + (v.at || 0) + '"' +
      ' role="img" title="' + esc(t) + '" aria-label="' + esc(t) + '">' +
      '<i style="width:' + pct + '%;background:linear-gradient(90deg,hsl(186 92% 64%),hsl(' + tono + ' 92% 64%))"></i></span>';
  }
  // La línea avanza sola: un tic ligero que sólo toca ancho, color y título de
  // las barras ya pintadas. No re-renderiza la tabla ni pide datos.
  function ticVentanas() {
    var barras = document.querySelectorAll("[data-yk-hourbar]");
    if (!barras.length) return;
    var ahora = Date.now();
    // Con reloj móvil cada agente va por su cuenta: el progreso se calcula por
    // barra desde SU última ventana, no de un reloj común.
    Array.prototype.forEach.call(barras, function (b) {
      var at = Number(b.getAttribute("data-at")) || 0;
      var abierta = b.getAttribute("data-abierta") === "1" && at > 0 && ahora - at < VENTANA_MS;
      if (!abierta && b.getAttribute("data-abierta") === "1") {
        // Se le cumplió la hora mientras mirabas: la puerta queda abierta.
        b.setAttribute("data-abierta", "0"); b.classList.add("libre");
      }
      var transcurrido = abierta ? Math.max(0, ahora - at) : 0;
      var v = { abierta:abierta, at:at, progreso:Math.min(1, transcurrido / VENTANA_MS),
        restante:Math.max(0, VENTANA_MS - transcurrido) };
      var i = b.querySelector("i");
      if (i && abierta) {
        i.style.width = (Math.round(v.progreso * 1000) / 10) + "%";
        i.style.background = "linear-gradient(90deg,hsl(186 92% 64%),hsl(" + tonoVentana(v.progreso) + " 92% 64%))";
      }
      var t = tituloVentana(v);
      b.setAttribute("title", t); b.setAttribute("aria-label", t);
    });
  }
  window.setInterval(ticVentanas, 15000);

  // ── SIGUIENTE VENTANA, EN CIFRA ───────────────────────────────────────────
  // En la fila desplegada, a la derecha de PUNTOS, cuánto le falta al agente
  // para poder abrir su próxima ventana autónoma.
  //
  // El dato bueno lo da /fleet/turnos, que cruza LAS DOS condiciones que aplica
  // el worker —su hora cumplida Y su turno dentro del reparto (07-08-2026)— y
  // devuelve la más tardía. Contar aquí sólo el cupo diría «AHORA» a un agente
  // que todavía tiene que esperar su franja: una cifra amable y falsa.
  //
  // Si el endpoint no responde se cae en silencio al reloj local, el mismo de
  // la línea bajo el nombre, y se dice en el título sobre qué se está contando.
  // Vale más una espera corta de menos que una promesa que el worker no cumple.
  function turnoDeAgente(a) {
    var lista = datos.turnos && datos.turnos.turnos;
    if (!Array.isArray(lista)) return null;
    for (var i = 0; i < lista.length; i++) {
      if (mismoAgenteVentana(lista[i].agent, "", a)) return lista[i];
    }
    return null;
  }
  // Un solo número para las dos fuentes: el instante en que podrá abrir.
  function proximaVentana(a) {
    var t = turnoDeAgente(a), ahora = Date.now();
    if (t) {
      return { proxima:Number(t.proxima) || ahora, fuente:"turnos",
        turno:Number(t.turno) || 0, agentes:Number(datos.turnos.agentes) || 0,
        pasoMin:Number(datos.turnos.pasoMin) || 0 };
    }
    // Sin nada que esperar, el instante es CERO, no «ahora»: un ahora capturado
    // aquí queda unos milisegundos en el futuro cuando lo mira quien pinta, y el
    // bloque parpadearía «en 0:00» en vez de decir AHORA.
    var v = ventanaHoraria(a);
    return { proxima:v.abierta ? v.at + VENTANA_MS : 0, fuente:"cupo", turno:0, agentes:0, pasoMin:0 };
  }
  function textoProximaVentana(p, ahora) {
    return p.proxima > ahora ? "en " + faltaTexto(p.proxima - ahora) : "AHORA";
  }
  function tituloProximaVentana(p, ahora) {
    if (p.fuente !== "turnos") {
      return p.proxima > ahora
        ? "Le queda " + faltaTexto(p.proxima - ahora) + " de su hora · reparto por turnos no disponible, "
          + "así que esto sólo cuenta su cupo"
        : "Cumplió su hora · sin el reparto por turnos no se puede confirmar que sea su franja";
    }
    var reparto = "Turno " + p.turno + " de " + p.agentes + " · una ventana cada " + p.pasoMin + " min";
    return p.proxima > ahora
      ? reparto + " · abre dentro de " + faltaTexto(p.proxima - ahora)
      : reparto + " · puede abrir AHORA: tiene la hora cumplida y le toca";
  }
  function etiquetaProximaVentana(p, ahora) {
    return "Siguiente ventana de decisión · " + textoProximaVentana(p, ahora) + ". " + tituloProximaVentana(p, ahora);
  }
  function proximaVentanaHtml(p) {
    var ahora = Date.now(), libre = p.proxima <= ahora;
    return '<div class="progression-step next-window' + (libre ? " libre" : "") + '" role="listitem"' +
      ' data-stage="proxima" data-yk-nextwindow="1" data-proxima="' + (p.proxima || 0) + '"' +
      ' data-fuente="' + esc(p.fuente) + '" data-turno="' + p.turno + '" data-agentes="' + p.agentes +
      '" data-paso="' + p.pasoMin + '"' +
      ' title="' + esc(tituloProximaVentana(p, ahora)) + '" aria-label="' + esc(etiquetaProximaVentana(p, ahora)) + '">' +
      '<span class="progression-dot" aria-hidden="true">»</span><span class="progression-copy">' +
      '<span class="progression-label">Siguiente</span>' +
      '<span class="progression-value">' + esc(textoProximaVentana(p, ahora)) + '</span></span></div>';
  }
  // La cifra corre segundo a segundo: una cuenta atrás que salta de quince en
  // quince se lee como una pantalla colgada. Sólo toca texto y clase, y sólo la
  // de las filas desplegadas — las demás están ocultas y no hay qué refrescar.
  function ticProximaVentana() {
    var chips = document.querySelectorAll("[data-yk-nextwindow]");
    if (!chips.length) return;
    var ahora = Date.now();
    Array.prototype.forEach.call(chips, function (c) {
      var fila = c.closest && c.closest("tr");
      if (fila && fila.hidden) return;
      var p = { proxima:Number(c.getAttribute("data-proxima")) || 0,
        fuente:c.getAttribute("data-fuente") || "cupo",
        turno:Number(c.getAttribute("data-turno")) || 0,
        agentes:Number(c.getAttribute("data-agentes")) || 0,
        pasoMin:Number(c.getAttribute("data-paso")) || 0 };
      c.classList.toggle("libre", p.proxima <= ahora);
      var valor = c.querySelector(".progression-value"), texto = textoProximaVentana(p, ahora);
      if (valor && valor.textContent !== texto) valor.textContent = texto;
      c.setAttribute("title", tituloProximaVentana(p, ahora));
      c.setAttribute("aria-label", etiquetaProximaVentana(p, ahora));
    });
  }
  window.setInterval(ticProximaVentana, 1000);

  // Clic en el agente → ventana de decisión sobre su proyecto. El trabajo lo
  // hace POST /projects/decision (ya existía): comprueba que el agente y su
  // equipo estén asociados al proyecto y pide las mejoras a Workers AI. Va por
  // seguroYokup, que es quien lleva la sesión del perímetro — sin ella el worker
  // no concede el cupo de 6/hora.
  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest && e.target.closest("[data-yk-launch]");
    if (!b || b.disabled) return;
    e.preventDefault(); e.stopPropagation();
    var previo = b.textContent;
    b.disabled = true; b.classList.add("lanzando"); b.textContent = "abriendo…";
    function suelta(msg, ok) {
      b.disabled = false; b.classList.remove("lanzando"); b.textContent = previo;
      if (msg) { b.setAttribute("title", msg); if (!ok) b.classList.add("rechazado"); }
    }
    ykFetch("/projects/decision", {
      method:"POST", headers:{ "content-type":"application/json" },
      body:JSON.stringify({ agent:b.getAttribute("data-agente"),
        machine:b.getAttribute("data-maquina"), project:b.getAttribute("data-proyecto") })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok) {
        suelta(d.existing ? "Ya tenía una ventana viva" : "Ventana abierta", true);
        window.dispatchEvent(new Event("yk:decisions-changed"));
        if (!d.existing && d.url) window.open(d.url, "_blank", "noopener");
        return;
      }
      // Los rechazos se dicen tal cual: el cupo, la falta de asociación o la IA.
      var e409 = d && d.error === "hourly_limit";
      suelta(e409 ? ("Cupo agotado: " + (d.usadas || 0) + "/" + (d.limite || 1) + " esta hora")
                  : ((d && (d.error || d.code)) || "No se pudo abrir"), false);
    }).catch(function () { suelta("Sin red", false); });
  });

  // El título dice DE DÓNDE sale el proyecto, que no es lo mismo estar metido en
  // faena que tenerlo asignado en el censo (Carlos, 2026-08-05).
  var TITULO_PROYECTO = {
    trabajo:"Proyecto en curso · sale de su trabajo de las últimas horas",
    declarado:"Proyecto principal de hoy · declarado expresamente; no hay una tarea activa que lo sustituya",
    principal:"Proyecto principal estructural · asignado en el censo; hoy no se declaró otro",
    defecto:"Sin proyecto asignado en el censo — hay que darle uno"
  };
  function proyectoHtml(a) {
    if (!a.proyecto) return '<span class="project-empty">—</span>';
    var origen = a.proyectoOrigen || "trabajo", label = esc(a.proyecto);
    var title = (TITULO_PROYECTO[origen] || TITULO_PROYECTO.trabajo) + " · " + label;
    // Si hoy ha tocado además otra cosa, se dice aquí: la columna anuncia la
    // asignación, pero el trabajo real no se esconde.
    if (a.proyectoFaena) title += " · hoy además ha tocado " + a.proyectoFaena;
    var clase = "project-chip" + (["declarado","principal"].indexOf(origen) >= 0 ? " principal" : "") +
      (origen === "defecto" ? " defecto" : "");
    return a.proyectoUrl
      ? '<a class="' + clase + '" href="' + esc(a.proyectoUrl) + '" target="_blank" rel="noopener" title="' + esc(title) + '">' + label + '</a>'
      : '<span class="' + clase + '" title="' + esc(title) + '">' + label + '</span>';
  }

  /* Ordenadores del agente: primero los que laten AHORA (encendidos), luego los
     conocidos sin latido reciente. `tope` recorta y añade «+N» para que el podio
     no se desmadre — Smith corre en 8 máquinas.
     La pastilla pinta el ALIAS CORTO del diccionario (MBP14, MBA16, MacMini…), no el
     nombre largo con el que late cada equipo. En una columna estrecha «MacBookProNegro14»
     se leía cortado como «MacBookProNegro», y un nombre a medias no nombra ninguna
     máquina (Carlos, 8-ago-2026 · normativa regla 02). Los nombres largos siguen
     enteros en el title, que es donde sí caben.
     Y como MBP14 = MacBookPro14 = macbookpro14negro = MacBookProNegro14 son LA MISMA
     máquina, dos grafías del mismo equipo se funden en UNA pastilla en vez de partir
     el equipo en dos: se normaliza, nunca se comparan literales. */
  function pintaMaquinas(a, tope) {
    var id = typeof window !== "undefined" && window.ykAgentIdentity;
    var vivas = a.maquinasVivas.slice().sort();
    var frias = a.maquinas.filter(function (m) { return vivas.indexOf(m) < 0; }).sort();
    var todas = [], porAlias = {};
    vivas.map(function (m) { return { m: m, on: true }; })
      .concat(frias.map(function (m) { return { m: m, on: false }; }))
      .forEach(function (t) {
        // Sin diccionario cargado, o equipo fuera de él, se pinta el nombre tal cual:
        // más vale largo que inventado.
        var alias = (id && id.suffix && id.suffix(t.m)) || t.m;
        var ya = porAlias[alias];
        if (ya) {
          ya.on = ya.on || t.on;
          if (ya.largos.indexOf(t.m) < 0) ya.largos.push(t.m);
          return;
        }
        porAlias[alias] = { alias: alias, on: t.on, largos: [t.m] };
        todas.push(porAlias[alias]);
      });
    if (!todas.length) return '<div class="maqs"><span class="maq-b">sin registro</span></div>';
    var largo = function (t) { return t.largos.join(" = "); };
    var muestra = tope ? todas.slice(0, tope) : todas, resto = todas.length - muestra.length;
    return '<div class="maqs" title="' + esc(todas.map(largo).join(" · ")) + '">' +
      muestra.map(function (t) {
        return '<span class="maq-b' + (t.on ? ' on' : '') + '" title="' + esc(largo(t)) + '">' +
          esc(t.alias) + '</span>';
      }).join("") +
      (resto > 0 ? '<span class="maq-mas">+' + resto + '</span>' : '') + '</div>';
  }

  // El realce late sobre una CIFRA, no sobre el hueco donde no hay ninguna.
  // Las dos señales de la fila salen de fuentes distintas: la columna cuenta lo
  // que ha PUNTUADO HOY (datos.actividad) y el realce marca lo que está EN CURSO
  // AHORA (datos.misiones/ideas/decisiones/tareas). Una misión in_progress que
  // aún no ha puntuado hoy dejaba la celda a 0 y latiendo —OraculoMBAPlata,
  // cazado por Carlos el 2026-08-05—: el agente parecía trabajando y marcando
  // cero a la vez. Con valor 0 no hay nada que realzar y la celda va limpia; la
  // actividad viva sigue contándose en las calles de trabajo activo y en la
  // carrera, que es donde un cero no se contradice. Afecta por igual a las
  // cuatro columnas (objetivos, ventanas, misiones, tareas).
  function numeroActividad(a, tipo, valor, singular) {
    if (a.actividad !== tipo) return valor;
    if (!(Number(valor) > 0)) return valor;
    var detalle = normaliza(a.actividadDetalle), texto = detalle || singular;
    return '<span class="activity-now" title="' + esc(texto) + '" aria-label="' + esc(valor + " " + tipo + ". " + texto) + '">' + valor + '</span>';
  }

  function numeroVentanas(a) {
    var contenido = parejaMetricaHtml(a,"windows");
    var ayuda = "Ventanas de esta hora / acumuladas hoy. No son simultáneas; las automáticas abren una sola cada 60 minutos.";
    return '<span class="window-day-total" title="' + esc(ayuda) + '" aria-label="' + esc(ayuda) + '">' + contenido + '</span>';
  }

  function indicadorMetricaHtml(a,key) { return parejaMetricaHtml(a,key); }

  function puntosHtml(a, progressId) {
    var metric=metricaHoraDia(a,"points");
    var resumen=metric.hour+" puntos en esta hora, "+metric.day+" puntos hoy";
    return '<button class="score-toggle" type="button" aria-expanded="false" aria-controls="' + esc(progressId) +
      '" aria-label="' + esc(resumen + ". " +
        tituloPuntosDiarios(estadoPuntosDiarios(a)) + ". Mostrar evolución") + '">' +
      parejaPuntosHtml(a) + '</button>';
  }

  var ETAPAS_PROGRESO = [
    { key:"objetivo", label:"Objetivo", aliases:["objective", "objectives", "objetivo", "objetivos"] },
    { key:"ventana", label:"Ventana", aliases:["window", "windows", "decision", "ventana", "ventanas"] },
    { key:"mision", label:"Misión", aliases:["mission", "missions", "mision", "misiones"] },
    { key:"tareas", label:"Tareas", aliases:["task", "tasks", "tarea", "tareas"] },
    { key:"puntos", label:"Puntos", aliases:["score", "points", "point", "puntos"] }
  ];

  function tipoEtapa(raw) {
    var clave = normaliza(raw).toLowerCase();
    for (var i = 0; i < ETAPAS_PROGRESO.length; i++) {
      if (ETAPAS_PROGRESO[i].aliases.indexOf(clave) >= 0 || ETAPAS_PROGRESO[i].key === clave) return ETAPAS_PROGRESO[i].key;
    }
    return "";
  }

  function estadoEtapa(raw) {
    var estado = normaliza(raw).toLowerCase().replace(/\s+/g, "_");
    if (["new", "nuevo", "nueva", "created", "appeared"].indexOf(estado) >= 0) return "new";
    if (["active", "activo", "activa", "open", "live", "doing", "in_progress"].indexOf(estado) >= 0) return "active";
    if (["complete", "completed", "completado", "completada", "done", "resolved", "scored"].indexOf(estado) >= 0) return "completed";
    return "future";
  }

  function etapaEnriquecida(stages, etapa) {
    var raw = null;
    if (Array.isArray(stages)) raw = stages.find(function (item) {
      return tipoEtapa(item && (item.type || item.stage || item.key || item.name)) === etapa.key;
    });
    else if (stages && typeof stages === "object") {
      etapa.aliases.concat([etapa.key]).some(function (alias) {
        if (!Object.prototype.hasOwnProperty.call(stages, alias)) return false;
        raw = stages[alias]; return true;
      });
    }
    if (raw == null) return { state:"future", value:"Pendiente" };
    if (typeof raw === "string") return { state:estadoEtapa(raw), value:normaliza(raw) };
    if (typeof raw === "number") return { state:raw > 0 ? "completed" : "future", value:String(raw) };
    return {
      state:estadoEtapa(raw.state || raw.status),
      value:normaliza(raw.label || raw.detail || raw.value || raw.count || raw.status || raw.state || "Pendiente")
    };
  }

  function progresionAgregada(a) {
    var valores = { objetivo:Number(a.objetivos) || 0, ventana:Number(a.ventanas) || 0,
      mision:Number(a.misiones) || 0, tareas:Number(a.tareas) || 0, puntos:Number(a.total) || 0 };
    var activa = tipoEtapa(a.actividad), origen = valores.objetivo > 0 || activa === "objetivo" ? "objetivo" :
      (valores.ventana > 0 || activa === "ventana" ? "ventana" : "");
    var esNueva = Number(a.actividadAt) > 0 && Date.now() - Number(a.actividadAt) <= 3 * 60 * 1000;
    return {
      linked:false, origin:origen, label:"Resumen del día · cadena sin enlazar",
      stages:ETAPAS_PROGRESO.map(function (etapa) {
        var valor = valores[etapa.key], state = valor > 0 ? "completed" : "future";
        if (activa === etapa.key) state = esNueva ? "new" : "active";
        return { key:etapa.key, label:etapa.label, state:state,
          value:etapa.key === "puntos" ? valor + " pt" + (valor === 1 ? "" : "s") : valor + " hoy" };
      })
    };
  }

  function normalizaProgresion(a) {
    var raw = a && a.progresion;
    if (!raw) return progresionAgregada(a || {});
    if (raw.aggregateFallback) {
      var resumen = progresionAgregada(a || {}); resumen.label = raw.label || resumen.label; return resumen;
    }
    var stages = Array.isArray(raw) ? raw : (raw.stages || raw.steps || raw.timeline || raw);
    var first = Array.isArray(stages) && stages[0] ? tipoEtapa(stages[0].type || stages[0].stage || stages[0].key) : "";
    var origin = tipoEtapa(raw.origin || raw.start || raw.from || first);
    var linked = raw.linked !== false;
    return {
      linked:linked, origin:origin,
      label:normaliza(raw.label || raw.title || raw.reference || (linked ? "Cadena enlazada" : "Resumen del día · cadena sin enlazar")),
      stages:ETAPAS_PROGRESO.map(function (etapa) {
        var item = etapaEnriquecida(stages, etapa);
        return { key:etapa.key, label:etapa.label, state:item.state, value:item.value };
      })
    };
  }

  function progresionHtml(a) {
    var progreso = normalizaProgresion(a), origen = progreso.origin === "objetivo" ? "Objetivo" :
      (progreso.origin === "ventana" ? "Ventana" : (progreso.origin === "mision" ? "Misión" : "No determinado"));
    // La franja «PUNTUACIÓN POR HORA» se retiró (Carlos, 2026-08-05): ocupaba una
    // línea entera de la fila desplegada para decir una cifra y una excusa. Esa
    // cifra vive ahora bajo el total, en la columna PUNTOS — ver puntosHtml.
    // Tras PUNTOS, la siguiente ventana autónoma de ESE agente: la cadena cuenta
    // lo que ya hizo, y esto cuánto falta para que pueda volver a decidir solo.
    var proxima = proximaVentana(a);
    var descripcion = progreso.label + ". Origen: " + origen + ". " + progreso.stages.map(function (s) {
      return s.label + ": " + s.state + ", " + s.value;
    }).join(". ") + ". " + etiquetaProximaVentana(proxima, Date.now());
    return '<div class="progression" role="list" aria-label="' + esc(descripcion) + '">' +
      '<div class="progression-meta" data-linked="' + (progreso.linked ? "true" : "false") + '" title="' + esc(progreso.label) + '">' +
      '<strong>' + esc(progreso.linked ? progreso.label : "Resumen no enlazado") + '</strong>Origen · ' + esc(origen) + '</div>' +
      progreso.stages.map(function (s, indice) {
        var origenClase = s.key === progreso.origin ? " origin" : "";
        var indiceOrigen = progreso.stages.findIndex(function (item) { return item.key === progreso.origin; });
        var preOrigen = indiceOrigen > 0 && indice < indiceOrigen ? " pre-origin" : "";
        var simbolo = s.state === "completed" ? "✓" : (s.state === "new" ? "+" : (s.state === "active" ? "›" : "·"));
        var title = s.label + " · " + s.state + " · " + s.value;
        return '<div class="progression-step ' + s.state + origenClase + preOrigen + '" role="listitem" data-stage="' + s.key +
          '" data-state="' + s.state + '" title="' + esc(title) + '" aria-label="' + esc(title) + '">' +
          '<span class="progression-dot" aria-hidden="true">' + simbolo + '</span><span class="progression-copy">' +
          '<span class="progression-label">' + s.label + '</span><span class="progression-value">' + esc(s.value) + '</span></span></div>';
      }).join("") + proximaVentanaHtml(proxima) + '</div>';
  }

  /* Columnas reajustables. El primer gesto congela las medidas fluidas actuales,
     después cada ancho se conserva en este navegador. Flechas ajustan 12 px y
     doble clic calcula el ancho necesario para el contenido de esa columna. */
  var COLUMNAS_KEY = "yokup.highscore.columnas.v1";
  var AGENT_SCOPE_KEY = "yokup.highscore.agents.v1";
  var AGENT_SCOPE_MODE_KEY = "yokup.highscore.agents.mode.v2";
  var DASHBOARD_TEAM_SCOPE_KEY = "yokup.dashboard.teams.v1";
  var AGENT_SCOPE = hsReadAgentScope();
  var AGENT_SCOPE_MODE = hsReadAgentScopeMode();
  var AGENT_SCOPE_OPEN_TEAMS = new Set();
  var PRESENCE_REQUEST_SEQUENCE = 0, PRESENCE_APPLIED_SEQUENCE = 0;
  var DESKTOP_APP_PENDING = Object.create(null);

  function aplicaAnchosColumnas(anchos) {

    columnas.forEach(function (col, i) {

      var ancho = Math.max(minimo, Math.round(Number(anchos[i]) || minimo));

  function anchosColumnas() {

  function anchoContenidoColumna(indice) {
    var celdas = document.querySelectorAll("#rankingTable tr > :nth-child(" + (indice + 1) + ")"), maximo = 0;
    celdas.forEach(function (celda) {

      if (tirador) tirador.remove();
      copia.style.cssText = "position:fixed;left:-9999px;top:0;width:max-content;max-width:none;white-space:nowrap;visibility:hidden";
      document.body.appendChild(copia); maximo = Math.max(maximo, Math.ceil(copia.getBoundingClientRect().width) + 22); copia.remove();
    });
    return Math.min(440, maximo || 80);

  function iniciaColumnasReajustables() {
    var tabla = document.getElementById("rankingTable"), cabeceras = tabla.querySelectorAll("thead th");
    try { aplicaAnchosColumnas(JSON.parse(localStorage.getItem(COLUMNAS_KEY) || "null")); } catch (_) {}
    cabeceras.forEach(function (th, indice) {
      var nombre = th.textContent.trim() || "posición", tirador = document.createElement("span");
      tirador.className = "col-resizer"; tirador.tabIndex = 0; tirador.setAttribute("role", "separator");
      tirador.setAttribute("aria-orientation", "vertical");
      tirador.setAttribute("aria-label", "Reajustar columna " + nombre);
      tirador.title = "Arrastra para reajustar · doble clic para autoajustar";
      tirador.addEventListener("pointerdown", function (evento) {
        evento.preventDefault(); evento.stopPropagation();
        var iniciales = anchosColumnas(), inicioX = evento.clientX, inicioAncho = iniciales[indice];
        aplicaAnchosColumnas(iniciales); tirador.classList.add("dragging"); document.body.classList.add("resizing-columns");
        tirador.setPointerCapture(evento.pointerId);
        function mueve(e) {
          var nuevos = iniciales.slice(), minimo = Number(tabla.querySelectorAll("colgroup col")[indice].getAttribute("data-min")) || 48;
          nuevos[indice] = Math.max(minimo, inicioAncho + e.clientX - inicioX); aplicaAnchosColumnas(nuevos);
        }

          guardaAnchosColumnas(anchosColumnas()); tirador.removeEventListener("pointermove", mueve); tirador.removeEventListener("pointerup", termina);
          tirador.removeEventListener("pointercancel", termina);

      });
