name = "yokup-api"
main = "src/index.js"
compatibility_date = "2025-07-18"

# ── DOMINIO PROPIO data.yokup.com (28-jul-2026, Morfeo16) ────────────────────
# Este worker es dependencia VIVA de /alta-punto y /alta-instalador (cargan
# config.js + data.js), y estaba solo en *.workers.dev, bloqueado por ISP españoles
# (188.114.96.0/22): el formulario de alta se veía pero podía no funcionar según la
# red. Mismo arreglo que se hizo en yokup-rtc con api.yokup.com.
#
# `workers_dev = true` es EXPLÍCITO a propósito: al declarar rutas, wrangler lo deja
# en false por defecto y el host workers.dev deja de enrutar (devuelve 404 / error
# 1042). Eso es justo lo que rompió el fallback de yokup-rtc y pasó 5 días invisible.
# Se mantiene vivo para no dejar ventana de caída mientras config.js apunta al host
# nuevo, y como respaldo después.
#
# OJO con el ORDEN en TOML: estas dos claves son de nivel superior y tienen que ir
# ANTES de cualquier tabla ([[d1_databases]], [observability]…). Si se ponen debajo,
# el parser las mete dentro de esa tabla y wrangler avisa con «Unexpected fields
# found in <tabla> field» y las ignora en silencio.
workers_dev = true
# Habilitar workers.dev activa las Preview URLs por defecto (una URL pública por
# versión); no queremos ampliar superficie.
preview_urls = false

[[routes]]
pattern = "data.yokup.com"
custom_domain = true

# admira.biz es el espejo de yokup.com (2-oct-2026). Sus portales llaman a este mismo
# worker en data.admira.biz para que las cookies de sesión (__Host-, SameSite=Strict)
# sean «mismo sitio» que la página; desde admira.biz, data.yokup.com es OTRO sitio y el
# navegador no guarda ni envía esas cookies. Mismo arreglo que api.admira.biz en yokup-rtc.
[[routes]]
pattern = "data.admira.biz"
custom_domain = true

# INTERCAMBIO DE DOMINIOS (Carlos, 4-oct-2026): admira.app pasará a ser la casa de Yokup.
# yk-casa.js deriva data.<casa> del host, así que allí los portales llamarán a data.admira.app.
[[routes]]
pattern = "data.admira.app"
custom_domain = true

# Backend de datos: Cloudflare D1 (SQLite). El binding se llama DB dentro del Worker.
[[d1_databases]]
binding = "DB"
database_name = "yokup-db"
database_id = "0c087ca2-ae5b-4589-a377-e9e615603c8d"

# ADMIRA_CIRCUIT_SECRET: HMAC required for /api/circuit/link and /api/circuit/status.
# INSTALLER_ADMIRA_SECRET: HMAC required for /api/installer/events.
# Secret opcional (set con `wrangler secret put`, NUNCA en el repo):
#   ADMIRA_WEBHOOK_SECRET -> HMAC del webhook de Admira (F1). Sin él, modo dev (acepta).

[observability]
enabled = true

[triggers]
crons = ["*/2 * * * *"]

# ── Yokup Desk (FLT-100938 · FLT-100940 · MorfeoMacMini · 24-sep-2026) ─────────────
# Relojes del despacho y destino de lo digital. Secretos (wrangler secret put, NUNCA aquí):
#   VAPID_PRIVATE        JWK P-256 del push del portal del instalador (pareja de VAPID_PUBLIC)
#   DEEPAGENT_PANEL_KEY  clave de agentes (bóveda ADMIRA_TELEGRAM_PANEL_KEY): entrega al bot-inbox
#                        y autoriza a los DeepAgents en /api/desk/*
# Opcional: DESK_OPS_CHAT_ID (chat de Telegram de operaciones para escalados).
[vars]
VAPID_PUBLIC = "BGix-M1_GMQQyjB357C_Ypkgri-eppBsKi4WQvKI3CGjLcAdzYFBlFwu9stSA4urIBGlPduei0l1jDE1F-6CC4U"
DEEPAGENT_PERSONA = "Smith"
DEEPAGENT_MACHINE = "macmini"
DEEPAGENT_PROJECT = "yokup"
DESK_ACCEPT_MIN = "15"
DESK_PROGRESS_MIN = "240"

# ── Incidencias unificadas (FLT-101298 · MorfeoMacMini · 30-sep-2026) ───────────────
# Service binding a yokup-rtc (bandeja Yokup): este worker le empuja el estado de las incidencias
# del portal/Desk (POST https://yokup-rtc.internal/internal/portal/sync) y yokup-rtc le devuelve los
# cierres por su binding INCIDENT_DESK. Sin secretos nuevos. Requisito: MISMA cuenta de Cloudflare
# que yokup-rtc (account_id 5b14…); los bindings no cruzan cuentas. Ver docs/incidencias-unificadas.md.
[[services]]
binding = "RTC"
service = "yokup-rtc"

# ── Informe PDF de incidencias DEMO (GrokBot · 7-oct-2026, petición de Carlos) ───────────────
# Cloudflare Email Routing de admira.live (MX route*.mx.cloudflare.net, misma cuenta). El binding
# FIJA el destinatario: el worker no puede escribir a nadie más que a Carlos (no es un relay).
# Remitente: incidencias@admira.live. Ruta: POST /api/demo/incident-report (src/demo-incident-report.js).
[[send_email]]
name = "INCIDENT_MAIL"
destination_address = "csilvasantin@gmail.com"

# ── Informe de misión (r2, GrokBot · 7-oct-2026) ─────────────────────────────────────────────────
# Workers AI: resumen ejecutivo del informe demo (mismo modelo que yokup-rtc; si falla, plantilla).
[ai]
binding = "AI"

# Historial de tickets del gemelo para el informe (fallos del activo, eventos de la incidencia).
# Es la D1 de yokup-rtc (bandeja Yokup); aquí SÓLO se lee (src/demo-incident-report.js · ticketHistory).
[[d1_databases]]
binding = "TICKETS"
database_name = "yokup-tickets"
database_id = "fc2d2810-0fb9-46bb-b05c-14c41fbd1b65"
